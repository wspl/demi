# Collects the executables the job's `cargo xtask native build` wrote, with
# their paths in the Cargo target directory, as one workflow artifact.
name: Collect programs
description: Uploads the job's built executables as one tar archive.
inputs:
  name:
    description: The workflow artifact's name.
    required: true
runs:
  using: composite
  steps:
    # Relative paths only: GNU tar on Windows reads C:\... as host:path.
    - name: Collect the executables
      shell: bash
      run: |
        cd .cache/native-target
        find . -maxdepth 3 -type f -path '*/release/demi-*' \
          ! -name '*.d' ! -name '*.pdb' -print > built.txt
        tar -cf "../../${{ inputs.name }}.tar" -T built.txt
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.name }}.tar
        retention-days: 1
