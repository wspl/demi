# The version of the commit the job checked out, as .github/scripts/version.sh
# names it. The checkout must hold the whole history of commits, not their files
# (`fetch-depth: 0`, `filter: tree:0`).
name: Version
description: Names the checked out commit's version.
outputs:
  version:
    description: The commit's version, <series>.<commits>.
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(.github/scripts/version.sh)" >> "$GITHUB_OUTPUT"
