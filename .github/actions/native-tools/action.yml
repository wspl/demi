# The native tools of the job's platform, at the pins the cross tools' image
# names (scripts/native/Dockerfile): Zig and cargo-zigbuild on Linux, the
# pinned Apple SDK on macOS, and the pinned MSVC toolset on Windows
# (docs/delivery/builds-and-releases.md § Toolchain). cargo-zigbuild comes
# prebuilt rather than compiled in every job.
name: Native tools
description: Installs the pinned native build tools of the runner's platform.
inputs:
  msvc:
    description: The Visual Studio architecture, amd64 or arm64, on Windows.
    required: false
runs:
  using: composite
  steps:
    - name: Install Zig
      if: runner.os == 'Linux'
      shell: bash
      run: python3 -m pip install --user --break-system-packages "ziglang==0.15.2"
    - uses: taiki-e/install-action@v2
      if: runner.os == 'Linux'
      with:
        tool: cargo-zigbuild@0.23.4
    - name: Select the pinned Apple SDK
      if: runner.os == 'macOS'
      shell: bash
      run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
    - name: Enter the Visual Studio environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.msvc }}
        # The pinned toolset, which Visual Studio 2022 carries beside newer
        # ones it would select by default.
        toolset: "14.44"
