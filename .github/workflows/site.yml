# Builds the website, packages/site, and publishes it to demi.sh after each
# push to main. A run that started finishes; of the pushes that arrive while it
# runs, only the newest waits, so the newest push is always published. A build
# takes longer than main often goes between pushes, so cancelling a running one
# for a newer push would publish nothing in a busy hour.
#
# The build needs the packages the site imports as built files: utils,
# conversation-client and protocol, which the Rust contracts generate; and
# Chromium, which records the demos and photographs the share image. The root
# `bun run build`, which the release build runs, leaves the site out.
#
# Cloudflare's account and an API token that may edit its Workers are the
# repository's secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/rust-cache
        with:
          key: site
      - run: bun install --frozen-lockfile
      - run: bun --filter @demicodes/utils --filter @demicodes/protocol --filter @demicodes/conversation-client build
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/site
      - run: bun run build
        working-directory: packages/site
      - run: bun run deploy
        working-directory: packages/site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
