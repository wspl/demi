# Builds a release and publishes it as a GitHub release
# (docs/delivery/builds-and-releases.md § Release workflow). A manual start
# on a branch publishes the branch's workspace version and creates its tag
# v<version>; a run started by a tag could not read the previous release's
# caches. Each platform's targets build natively on
# the newest free standard runner of that platform, and every step is a
# command of the repository: the workflow only orders them and carries files
# between jobs.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Cargo judges a source file by its checksum rather than its mtime, which a
  # fresh checkout sets to the checkout's time: by mtime, every vendored crate
  # restored from the previous release's cache compiled again. The unstable
  # flag only lets Cargo accept the setting, so both are needed. These are in
  # the workflow, not .cargo/config.toml, so a developer's builds keep mtimes.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: true
  CARGO_BUILD_FINGERPRINT: content

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          [ "$GITHUB_REF_TYPE" = branch ] || {
            echo 'a release starts on a branch, whose caches the next release reads' >&2
            exit 1
          }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version has a release already: a published version is immutable" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each target's programs in two jobs, the runner and the command programs,
  # so no runner compiles two targets or two groups one after the other.
  programs:
    name: ${{ matrix.group }} ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every job's result in one run: any failure stops the release anyway,
      # at the server release that needs them all.
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        group: [runner, commands]
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            msvc: amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msvc: arm64
          - group: runner
            packages: --package demi-runner
          - group: commands
            packages: --package demi-file --package demi-browser --package demi-claude-code
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-tools
        with:
          msvc: ${{ matrix.msvc }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.target }}-${{ matrix.group }}
      - name: Build
        if: runner.os != 'Windows'
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} ${{ matrix.packages }}
      # Not in bash: Git's /usr/bin/link comes before MSVC's link.exe there.
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} ${{ matrix.packages }}
      # Packaging compresses each program into the cache, by its SHA-256,
      # where the server release finds the copies made, so it compresses
      # none itself; what packaging publishes is thrown away.
      - name: Compress the programs
        run: |
          for argument in ${{ matrix.packages }}; do
            [ "$argument" != --package ] || continue
            cargo run --locked --package xtask --no-default-features -- native package \
              --package "$argument" --target ${{ matrix.target }} \
              --output "$RUNNER_TEMP/packages/$argument" --compressed compressed
          done
      - uses: ./.github/actions/collect-programs
        with:
          name: native-${{ matrix.target }}-${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        with:
          name: compressed-${{ matrix.target }}-${{ matrix.group }}
          path: compressed
          retention-days: 1
      # The server release of this architecture, which builds its image too,
      # runs the xtask this job built rather than compiling its own.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.group == 'runner'
        with:
          name: xtask-${{ matrix.target }}
          path: target/debug/xtask
          retention-days: 1

  server:
    name: server ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-tools
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} --package demi-backend --package demi-machine-manager --package demi-server
      - uses: ./.github/actions/collect-programs
        with:
          name: native-${{ matrix.target }}-server

  web:
    name: Web app
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The contracts the packages are built from compile the workspace.
      - uses: ./.github/actions/rust-cache
      - run: bun install --frozen-lockfile
      # The packages the web app imports are built first, as their dist/.
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: packages/web/dist
          retention-days: 1

  # Each Linux architecture's server release in one job: its root, the
  # release's files, and the Cloud image built from them, so an
  # architecture's image starts as soon as its own root is assembled. A
  # matrix job cannot wait for one leg of another matrix, which is why the
  # image is not a job of its own. Both legs assemble the release's files
  # from the same executables and compressed copies; publish checks they
  # are the same and publishes one copy.
  server-release:
    name: Server release ${{ matrix.arch }}
    needs: [version, programs, server, web]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # For the image build script and its pins.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: compressed-*
          path: compressed
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ runner.temp }}/web
      - uses: actions/download-artifact@v8
        with:
          name: xtask-${{ matrix.target }}
          path: ${{ runner.temp }}/xtask
      - name: Gather the executables
        run: |
          chmod +x "$RUNNER_TEMP/xtask/xtask"
          mkdir -p native-target
          for archive in "$RUNNER_TEMP"/native/native-*.tar; do
            tar -xf "$archive" -C native-target
          done
      # The release's files are the ones the release offers at its download
      # location.
      - name: Assemble the root and the release's files
        run: |
          mkdir -p dist/server
          "$RUNNER_TEMP/xtask/xtask" server-release --publish --output "$RUNNER_TEMP/root" \
            --files files --downloads "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --server ${{ matrix.target }} --web "$RUNNER_TEMP/web" \
            --artifacts native-target --compressed compressed
          tar --zstd -cf "dist/server/demi-$VERSION-server-linux-${{ matrix.arch }}.tar.zst" \
            -C "$RUNNER_TEMP/root" .
          cp "native-target/${{ matrix.target }}/release/demi-server" \
            "dist/server/demi-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.arch }}
          path: dist/server
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: files-${{ matrix.arch }}
          path: files
          retention-days: 1
      # The build's apt fetches from the Ubuntu mirror in GitHub's own
      # network, which the runner itself uses, rather than from across the
      # internet, where one release's build waited four minutes on stalled
      # downloads; the image still names Ubuntu's archive.
      - name: Build the image
        run: |
          sudo bash cloud-guest-image/rootfs/build.sh \
            --xtask "$RUNNER_TEMP/xtask/xtask" \
            --release "$RUNNER_TEMP/root" \
            --files "$PWD/files" \
            --work "$RUNNER_TEMP/work" \
            --output "$RUNNER_TEMP/out/image" \
            --mirror http://azure.archive.ubuntu.com/ubuntu
          mkdir -p dist/image
          tar -cf "dist/image/demi-$VERSION-image-linux-${{ matrix.arch }}.tar" -C "$RUNNER_TEMP/out" image
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: dist/image
          retention-days: 1

  publish:
    name: Publish
    needs: [version, server-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For install.sh.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: files-*
          path: ${{ runner.temp }}/files
      # Each architecture's server release assembled the release's files,
      # which both roots' manifests name: one copy is published, so the two
      # must be the same file for file.
      - name: Check that both architectures' files are the same
        run: diff --recursive "$RUNNER_TEMP/files/files-amd64" "$RUNNER_TEMP/files/files-arm64"
      - name: Publish the release
        run: |
          cp "$RUNNER_TEMP"/files/files-amd64/* dist/
          sed "s/@VERSION@/$VERSION/" crates/server/install.sh > dist/install.sh
          cd dist
          sha256sum demi-* > SHA256SUMS
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Demi $VERSION" --generate-notes ./*
