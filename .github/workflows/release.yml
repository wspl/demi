# Publishes a build as a GitHub release.
#
# Starting it:
#
# - A manual start on a branch, `gh workflow run release.yml --ref <branch>`,
#   publishes the build of the branch's newest commit, or with `commit`, of that
#   commit, which must be in the branch's history. It refuses a version that has
#   a release already or is below the highest published one, since servers find
#   the newest release among those published last (crates/shared-artifacts/
#   src/releases.rs), and creates the tag v<version> on the commit it published
#   (the npm packages' tags name their package, so the two never collide).
# - canary.yml starts it for a push to main whose build and checks passed.
#   Nothing else starts it.
# - With `prerelease`, as a deploy and canary.yml start it
#   (docs/delivery/upgrades.md), it publishes a pre-release, which no installer
#   takes as the newest and which a later `gh release edit` publishes.
#
# The files come from the commit's build, which build.yml made when the commit
# was pushed:
#
#   find the commit's build ─┬─ finished, its files kept ─► publish them
#                            ├─ running or waiting ───────► wait, then publish
#                            └─ none, failed, or expired ─► build.yml, then
#                                                           publish
#
# Only a build of the branch is found, and only one whose files are all kept for
# two more hours (.github/scripts/build-files.sh). A build whose files expired is
# not found, and a build that was cancelled because a newer push took its place
# never finished: both are built again here, by the build.yml of the branch's
# newest commit, so a commit that is not the newest is built again only when
# `.github` is the same in both.
name: Release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The full SHA of the commit to publish, the branch's newest when empty.
        type: string
        default: ""
      prerelease:
        description: Publish a pre-release, never marked latest, as a deploy does.
        type: boolean
        default: false

# The jobs that read another run's files and runs also read the repository's
# actions.
permissions:
  contents: read
  actions: read

# One run of a branch at a time, the others waiting in order: a release or a
# deploy is never cancelled by the next one, as the default single pending
# place would cancel the waiting one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  find:
    name: Find the build
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      run-id: ${{ steps.build.outputs.run-id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          filter: tree:0
      - id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        uses: ./.github/actions/version
      - name: Check the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          [ "$GITHUB_REF_TYPE" = branch ] || {
            echo 'a release starts on a branch, whose caches the next build reads' >&2
            exit 1
          }
          # The version counts the commit's history, so it names the commit
          # only along one line of history: a commit of another branch would
          # take the version of the branch's commit with the same count.
          git merge-base --is-ancestor "$COMMIT" "origin/$GITHUB_REF_NAME" || {
            echo "$COMMIT is not in the history of $GITHUB_REF_NAME" >&2
            exit 1
          }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$VERSION has a release already: a published version is immutable" >&2
            exit 1
          fi
          # Versions are published in their order: a server finds the newest
          # among the releases GitHub's feed lists, the ten published last.
          highest=$(git tag --list 'v[0-9]*' | sort -V | tail -n 1)
          if [ -n "$highest" ] && [ "$(printf '%s\nv%s\n' "$highest" "$VERSION" | sort -V | tail -n 1)" = "$highest" ]; then
            echo "v$VERSION is below $highest, which is published: versions are published in their order" >&2
            exit 1
          fi
      # The newest finished build of the branch whose files are all kept;
      # failing that, the newest that has not finished, which this step waits
      # for and then looks again. A cancelled or failed build, and one whose
      # files expired, is no build.
      - id: build
        name: Find the commit's build
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          for _ in 1 2 3; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$COMMIT" \
              --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId,status,conclusion)
            for id in $(jq -r '.[] | select(.conclusion == "success") | .databaseId' <<< "$runs"); do
              if .github/scripts/build-files.sh "$id" > /dev/null; then
                echo "run-id=$id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            running=$(jq -r '[.[] | select(.status != "completed")][0].databaseId // empty' <<< "$runs")
            [ -n "$running" ] || break
            gh run watch "$running" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null || true
          done
          echo "run-id=" >> "$GITHUB_OUTPUT"
      # The called build.yml is the branch's newest commit's, while its sources
      # and actions are the commit's.
      - name: Check that the branch's build can build the commit
        if: steps.build.outputs.run-id == ''
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          git diff --quiet "$COMMIT" "$GITHUB_SHA" -- .github || {
            echo "$COMMIT has no build to publish, and the workflows of $GITHUB_REF_NAME's newest commit would build it differently: publish the newest commit instead" >&2
            exit 1
          }

  build:
    name: Build
    needs: find
    if: needs.find.outputs.run-id == ''
    uses: ./.github/workflows/build.yml
    with:
      commit: ${{ needs.find.outputs.commit }}
    secrets: inherit

  publish:
    name: Publish
    needs: [find, build]
    if: ${{ !cancelled() && needs.find.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.find.outputs.version }}
      COMMIT: ${{ needs.find.outputs.commit }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # For install.sh.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.find.outputs.commit }}
      # A download by pattern skips an artifact that is gone without an error,
      # so what the build has is checked first, and what was downloaded after.
      - id: files
        name: Check that the build's files are kept
        env:
          RUN_ID: ${{ needs.find.outputs.run-id || github.run_id }}
        run: echo "symbols=$(.github/scripts/build-files.sh "$RUN_ID")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.find.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.find.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: image-*
          path: dist
          merge-multiple: true
      # Each executable's debug file for each target, which the release
      # publishes beside its assets and no device downloads.
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.find.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: symbols-*
          path: ${{ runner.temp }}/symbols
      # A version is published once, so a release that lacks an asset is
      # never published: `demi-server upgrade` needs a server release and an
      # image for the architecture it runs on.
      - name: Check that every asset was downloaded
        env:
          SYMBOLS: ${{ steps.files.outputs.symbols }}
        run: |
          missing=0
          for file in \
            dist/demi-"$VERSION"-server-linux-{amd64,arm64}.tar.zst \
            dist/demi-"$VERSION"-image-linux-{amd64,arm64}.tar \
            dist/demi-server-{x86_64,aarch64}-unknown-linux-musl; do
            [ -s "$file" ] || { echo "missing: $file" >&2; missing=1; }
          done
          # A build from before a server release held its programs names
          # them as assets of their own, which no release publishes now.
          for archive in dist/demi-"$VERSION"-server-linux-{amd64,arm64}.tar.zst; do
            [ ! -s "$archive" ] || tar --zstd -tf "$archive" ./files/ > /dev/null 2>&1 || {
              echo "missing: files/ in $archive, built before a release held its programs: publish a newer commit" >&2
              missing=1
            }
          done
          directories=$(find "$RUNNER_TEMP/symbols" -mindepth 1 -maxdepth 1 -type d | wc -l)
          [ "$directories" -eq "$SYMBOLS" ] || {
            echo "missing: debug files: $directories of $SYMBOLS artifacts downloaded" >&2
            missing=1
          }
          for directory in "$RUNNER_TEMP"/symbols/*/; do
            [ -n "$(ls -A "$directory")" ] || { echo "missing: files in $directory" >&2; missing=1; }
          done
          exit "$missing"
      - name: Publish the release
        run: |
          cp "$RUNNER_TEMP"/symbols/*/* dist/
          # The release's licenses, notice and third-party notices, as
          # assets, from the root of a server release.
          tar --zstd -xf "dist/demi-$VERSION-server-linux-amd64.tar.zst" -C dist \
            ./LICENSE ./LICENSE-DEMI ./NOTICE ./THIRD-PARTY-NOTICES
          cd dist
          sha256sum demi-* > SHA256SUMS
          # A pre-release is never the latest release, which the installer
          # and `demi-server upgrade` without a version take.
          kind=()
          if [ "$PRERELEASE" = true ]; then
            kind=(--prerelease --latest=false)
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" --title "Demi $VERSION" --generate-notes "${kind[@]}" ./*
