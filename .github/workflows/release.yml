# Builds a release and publishes it as a GitHub release
# (docs/delivery/builds-and-releases.md § Release workflow). A manual start
# on a branch publishes the branch's workspace version and creates its tag
# v<version>; a run started by a tag could not read the previous release's
# caches. Each platform's targets build natively on
# the newest free standard runner of that platform, and every step is a
# command of the repository: the workflow only orders them and carries files
# between jobs.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          [ "$GITHUB_REF_TYPE" = branch ] || {
            echo 'a release starts on a branch, whose caches the next release reads' >&2
            exit 1
          }
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "v$version has a release already: a published version is immutable" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each target's programs in two jobs, the runner and the command programs,
  # so no runner compiles two targets or two groups one after the other.
  programs:
    name: ${{ matrix.group }} ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # Every job's result in one run: any failure stops the release anyway,
      # at the server release that needs them all.
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        group: [runner, commands]
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            msvc: amd64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msvc: arm64
          - group: runner
            packages: --package demi-runner
          - group: commands
            packages: --package demi-file --package demi-browser --package demi-claude-code
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-tools
        with:
          msvc: ${{ matrix.msvc }}
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.target }}-${{ matrix.group }}
      - name: Build
        if: runner.os != 'Windows'
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} ${{ matrix.packages }}
      # Not in bash: Git's /usr/bin/link comes before MSVC's link.exe there.
      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} ${{ matrix.packages }}
      # Packaging compresses each program into the cache, by its SHA-256,
      # where the server release finds the copies made; what it packages is
      # thrown away.
      - name: Compress the command programs
        if: matrix.group == 'commands'
        run: |
          for package in demi-file demi-browser demi-claude-code; do
            cargo run --locked --package xtask --no-default-features -- native package \
              --package "$package" --target ${{ matrix.target }} \
              --output "$RUNNER_TEMP/packages/$package" --compressed compressed
          done
      - uses: ./.github/actions/collect-programs
        with:
          name: native-${{ matrix.target }}-${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: matrix.group == 'commands'
        with:
          name: compressed-${{ matrix.target }}
          path: compressed
          retention-days: 1
      # The server release and the image of this architecture run the xtask
      # this job built rather than compiling their own.
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.group == 'runner'
        with:
          name: xtask-${{ matrix.target }}
          path: target/debug/xtask
          retention-days: 1

  server:
    name: server ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-tools
      - uses: ./.github/actions/rust-cache
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo run --locked --package xtask --no-default-features -- native build --target ${{ matrix.target }} --package demi-backend --package demi-machine-manager --package demi-server
      - uses: ./.github/actions/collect-programs
        with:
          name: native-${{ matrix.target }}-server

  web:
    name: Web app
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The contracts the packages are built from compile the workspace.
      - uses: ./.github/actions/rust-cache
      - run: bun install --frozen-lockfile
      # The packages the web app imports are built first, as their dist/.
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: packages/web/dist
          retention-days: 1

  server-release:
    name: Server release
    needs: [version, programs, server, web]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # For install.sh.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: compressed-*
          path: compressed
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: ${{ runner.temp }}/web
      - uses: actions/download-artifact@v8
        with:
          name: xtask-x86_64-unknown-linux-musl
          path: ${{ runner.temp }}/xtask
      - name: Gather the executables
        run: |
          chmod +x "$RUNNER_TEMP/xtask/xtask"
          mkdir -p native-target
          for archive in "$RUNNER_TEMP"/native/native-*.tar; do
            tar -xf "$archive" -C native-target
          done
      # Both roots share the release's files, which the release offers at
      # its download location.
      - name: Assemble the roots and the release's files
        run: |
          mkdir -p dist
          downloads="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          for pair in amd64:x86_64-unknown-linux-musl arm64:aarch64-unknown-linux-musl; do
            arch=${pair%%:*}
            target=${pair#*:}
            root="$RUNNER_TEMP/roots/$arch"
            "$RUNNER_TEMP/xtask/xtask" server-release --publish --output "$root" \
              --files files --downloads "$downloads" --server "$target" \
              --web "$RUNNER_TEMP/web" --artifacts native-target --compressed compressed
            tar --zstd -cf "dist/demi-$VERSION-server-linux-$arch.tar.zst" -C "$root" .
            cp "native-target/$target/release/demi-server" "dist/demi-server-$target"
          done
          sed "s/@VERSION@/$VERSION/" crates/server/install.sh > dist/install.sh
      - uses: actions/upload-artifact@v7
        with:
          name: server
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: files
          path: files
          retention-days: 1

  image:
    name: Image ${{ matrix.arch }}
    needs: [version, programs, server-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: ${{ runner.temp }}/server
      - uses: actions/download-artifact@v8
        with:
          name: files
          path: ${{ runner.temp }}/files
      - uses: actions/download-artifact@v8
        with:
          name: xtask-${{ matrix.target }}
          path: ${{ runner.temp }}/xtask
      - name: Unpack the root
        run: |
          chmod +x "$RUNNER_TEMP/xtask/xtask"
          mkdir "$RUNNER_TEMP/root"
          tar --zstd -xf "$RUNNER_TEMP/server/demi-$VERSION-server-linux-${{ matrix.arch }}.tar.zst" \
            -C "$RUNNER_TEMP/root"
      - name: Build the image
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          sudo bash cloud-guest-image/rootfs/build.sh \
            --xtask "$RUNNER_TEMP/xtask/xtask" \
            --release "$RUNNER_TEMP/root" \
            --files "$RUNNER_TEMP/files" \
            --work "$RUNNER_TEMP/work" \
            --output "$RUNNER_TEMP/out/image"
          mkdir -p dist
          tar -cf "dist/demi-$VERSION-image-linux-${{ matrix.arch }}.tar" -C "$RUNNER_TEMP/out" image
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: dist
          retention-days: 1

  publish:
    name: Publish
    needs: [version, server-release, image]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: files
          path: dist
      - name: Publish the release
        run: |
          cd dist
          sha256sum demi-* > SHA256SUMS
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Demi $VERSION" --generate-notes ./*
