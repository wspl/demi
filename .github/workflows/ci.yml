name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config

      - run: rustup show

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Type-check web
        run: bun run typecheck:web

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: llms-full.txt is up to date
        run: bun run llms && git diff --exit-code llms-full.txt
