# Checks each pull request and each push to main or feat/demi-next, the
# development trunk, on a stock Linux runner
# (docs/delivery/testing.md): the workspace's one Cargo selection, checked
# and tested; the web app's suites and type checks; the public registry
# check; and gitleaks over the commits. The suites that need Chrome, a real
# machine manager or a vendor's CLI are ignored tests that run only where
# their resources are supplied, which no job here does.
name: CI

on:
  pull_request:
  push:
    branches: [main, feat/demi-next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-cache
        with:
          key: ci
      - run: bun install --frozen-lockfile
      # The machine manager's storage tests run the programs a Cloud server
      # installs (docs/cloud/setup.md); the stock image lacks bsdtar and nft.
      - run: sudo apt-get update -q && sudo apt-get install -y -q e2fsprogs libarchive-tools nftables
      - run: cargo check --locked --workspace --all-targets --features demi-runner/test-fixtures
      - run: cargo test --locked --workspace --features demi-runner/test-fixtures
      - run: bun run test
      - run: bun run typecheck:web
      - run: bun run check:registry

  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    steps:
      # The whole history, from which gitleaks reads the commits the push or
      # the pull request adds; .gitleaks.toml at the root is its settings.
      # The commits before the open-source rewrite hold old example values
      # the allowlist does not cover, so a scan never reaches back past the
      # range the event brings. gitleaks/gitleaks-action is not used: it
      # fails on a pull request whose commits a rewrite replaced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch or a forced push: the tree as it is now.
            gitleaks dir . --redact --no-banner
            exit
          fi
          gitleaks git . --log-opts="$range" --redact --no-banner
