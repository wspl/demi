# Checks each pull request and each push to main, the development trunk, on a
# stock Linux runner (docs/delivery/testing.md). The jobs check:
#
# - The workspace's one Cargo selection, checked and tested.
# - The web app's type checks.
# - The public registry check.
# - The commits, with gitleaks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push cancels its older run. A push to main is never
# cancelled: Canary publishes a commit only when its own checks passed, and the
# next push may build nothing (build.yml), so a cancelled run would keep the
# commit's changes from Canary until a later push that builds.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: ./.github/actions/rust-cache
        with:
          key: ci
      - run: bun install --frozen-lockfile
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: bun run typecheck:web
      - run: bun run check:registry

  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    steps:
      # The whole history, from which gitleaks reads the commits the push or
      # the pull request adds; .gitleaks.toml at the root is its settings.
      # The commits before the open-source rewrite hold old example values
      # the allowlist does not cover, so a scan never reaches back past the
      # range the event brings. gitleaks/gitleaks-action is not used: it
      # fails on a pull request whose commits a rewrite replaced.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE_SHA..HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch or a forced push: the tree as it is now.
            gitleaks dir . --redact --no-banner
            exit
          fi
          gitleaks git . --log-opts="$range" --redact --no-banner
