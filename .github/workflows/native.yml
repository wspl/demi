name: Native runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install target
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Linux compiler dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config musl-tools
      - name: Execute native conformance
        shell: bash
        run: cargo test --locked --workspace --no-fail-fast --target '${{ matrix.target }}'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Installer lifecycle
        shell: bash
        env:
          DEMI_RUNNER_TEST_BINARY: target/${{ matrix.target }}/debug/demi-runner${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
        run: bun test --conditions development --rerun-each 3 packages/backend/src/__tests__/runner-install.test.ts packages/runner/src/__tests__/release.test.ts
      - name: Build executables
        shell: bash
        run: cargo build --locked --release --target '${{ matrix.target }}' -p demi-runner -p demi-builtin-package
      - name: Verify static Linux linkage
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          for binary in demi-runner demi-commands; do
            artifact='target/${{ matrix.target }}/release/'"$binary"
            if readelf -l "$artifact" | grep -q INTERP; then
              echo "Unexpected ELF interpreter: $artifact"
              exit 1
            fi
            if readelf -d "$artifact" | grep -q NEEDED; then
              echo "Unexpected dynamic dependency: $artifact"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/demi-runner*
            target/${{ matrix.target }}/release/demi-commands*
          if-no-files-found: error

  rust-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
