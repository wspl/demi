[workspace]
resolver = "3"
members = ["packages/command-protocol", "packages/command-service", "packages/command-runtime", "packages/runner-protocol", "packages/demi-package"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
bytes = "1"
futures-util = "0.3"
h2 = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
lto = "thin"
strip = true
