uu_tac = { path = "vendor/uutils-coreutils/uu_tac" }
uu_basename = { path = "vendor/uutils-coreutils/uu_basename" }
uu_dirname = { path = "vendor/uutils-coreutils/uu_dirname" }
uu_realpath = { path = "vendor/uutils-coreutils/uu_realpath" }
uu_env = { path = "vendor/uutils-coreutils/uu_env" }
uu_seq = { path = "vendor/uutils-coreutils/uu_seq" }
uu_date = { path = "vendor/uutils-coreutils/uu_date" }
uu_sleep = { path = "vendor/uutils-coreutils/uu_sleep" }
uu_mktemp = { path = "vendor/uutils-coreutils/uu_mktemp" }
