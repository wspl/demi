uu_du = { path = "vendor/uutils-coreutils/uu_du" }
uu_df = { path = "vendor/uutils-coreutils/uu_df" }
uu_od = { path = "vendor/uutils-coreutils/uu_od" }
uu_chmod = { path = "vendor/uutils-coreutils/uu_chmod" }
