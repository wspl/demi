[workspace]
resolver = "3"
exclude = ["vendor/*", "vendor/chromiumoxide", "vendor/chromiumoxide_cdp"]
members = [
  "crates/agent-protocol",
  "crates/artifact",
  "crates/builtin-protocol",
  "crates/claude-protocol",
  "crates/command-service",
  "crates/command-tree",
  "crates/core",
  "crates/demi-claude",
  "crates/demi-commands",
  "crates/gates",
  "crates/provider",
  "crates/runner",
  "crates/runner-protocol",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
garde = { version = "0.23", features = ["derive", "regex", "url"] }
h2 = "0.4"
http = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_plain = "1"
serde_with = { version = "3", default-features = false }
thiserror = "2"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[profile.dev]
# Line tables are enough for test backtraces. Full debug info made every test
# binary hundreds of megabytes, and linking them waited on the disk.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
chromiumoxide = { path = "vendor/chromiumoxide" }
chromiumoxide_cdp = { path = "vendor/chromiumoxide_cdp" }
jaq-core = { path = "vendor/jaq-core" }
argmax = { path = "vendor/argmax" }
brush-core = { path = "vendor/brush-core" }
uucore = { path = "vendor/uucore" }
uu_cat = { path = "vendor/uu_cat" }
uucore_procs = { path = "vendor/uucore_procs" }
uu_head = { path = "vendor/uu_head" }
uu_tail = { path = "vendor/uu_tail" }
uu_wc = { path = "vendor/uu_wc" }
uu_ls = { path = "vendor/uu_ls" }
uu_cp = { path = "vendor/uu_cp" }
uu_mv = { path = "vendor/uu_mv" }
uu_rm = { path = "vendor/uu_rm" }
uu_mkdir = { path = "vendor/uu_mkdir" }
uu_rmdir = { path = "vendor/uu_rmdir" }
uu_touch = { path = "vendor/uu_touch" }
uu_tee = { path = "vendor/uu_tee" }
uu_sort = { path = "vendor/uu_sort" }
uu_uniq = { path = "vendor/uu_uniq" }
uu_cut = { path = "vendor/uu_cut" }
uu_tr = { path = "vendor/uu_tr" }
uu_paste = { path = "vendor/uu_paste" }
uu_nl = { path = "vendor/uu_nl" }
uu_tac = { path = "vendor/uu_tac" }
uu_basename = { path = "vendor/uu_basename" }
uu_dirname = { path = "vendor/uu_dirname" }
uu_realpath = { path = "vendor/uu_realpath" }
uu_env = { path = "vendor/uu_env" }
uu_seq = { path = "vendor/uu_seq" }
uu_date = { path = "vendor/uu_date" }
uu_sleep = { path = "vendor/uu_sleep" }
uu_mktemp = { path = "vendor/uu_mktemp" }
uu_stat = { path = "vendor/uu_stat" }
uu_du = { path = "vendor/uu_du" }
uu_df = { path = "vendor/uu_df" }
uu_od = { path = "vendor/uu_od" }
uu_chmod = { path = "vendor/uu_chmod" }
uu_chown = { path = "vendor/uu_chown" }

uu_grep = { path = "vendor/uu_grep" }
sed = { path = "vendor/sed" }
findutils = { path = "vendor/findutils" }
diffutils = { path = "vendor/diffutils" }

jaq-std = { path = "vendor/jaq-std" }

ignore = { path = "vendor/ignore" }
grep-cli = { path = "vendor/grep-cli" }

jaq = { path = "vendor/jaq" }
ripgrep = { path = "vendor/ripgrep" }
