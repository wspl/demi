[workspace]
resolver = "3"
exclude = ["vendor/*/*"]
members = [
  "crates/agent-server",
  "crates/conversation-socket-protocol",
  "crates/agent-session",
  "crates/agent-store",
  "crates/agent-tools",
  "crates/agent-transcript",
  "crates/shared-artifacts",
  "crates/shared-cli",
  "crates/backend",
  "crates/backend-accounts",
  "crates/backend-cloud",
  "crates/backend-http",
  "crates/backend-expose",
  "crates/backend-host-access",
  "crates/backend-idle-watch",
  "crates/backend-blobs",
  "crates/backend-providers",
  "crates/backend-runners",
  "crates/backend-user-shard",
  "crates/backend-database",
  "crates/server",
  "crates/backend-page-sync",
  "crates/backend-permissions",
  "crates/command-package-browser-protocol",
  "crates/command-package-claude-code-protocol",
  "crates/plugin-interface",
  "crates/plugin-changes",
  "crates/plugin-file-browser",
  "crates/plugin-file",
  "crates/plugin-skills",
  "crates/plugin-browser",
  "crates/plugin-expose",
  "crates/backend-plugins",
  "crates/command-protocol",
  "crates/command-sdk",
  "crates/command-declarations",
  "crates/shared-types",
  "crates/command-package-browser",
  "crates/command-package-browser-chrome",
  "crates/command-package-claude-code",
  "crates/command-package-file",
  "crates/command-package-file-protocol",
  "crates/shared-gates",
  "crates/backend-remote-host",
  "crates/machine-manager",
  "crates/machine-manager-protocol",
  "crates/provider-common",
  "crates/provider-anthropic-api",
  "crates/provider-claude-code",
  "crates/provider-codex",
  "crates/provider-google",
  "crates/provider-grok-build",
  "crates/provider-openai-api",
  "crates/runner",
  "crates/runner-host",
  "crates/runner-jobs",
  "crates/runner-process",
  "crates/runner-protocol",
  "crates/runner-command-packages",
  "crates/runner-shell",
  "crates/host-interface",
  "crates/web-api-protocol",
  "crates/xtask",
]

[workspace.package]
version = "0.1.10"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
garde = { version = "0.23", features = ["derive", "regex", "url"] }
h2 = "0.4"
http = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
schemars = "1.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_plain = "1"
serde_with = { version = "3", default-features = false }
thiserror = "2"
# One reqwest for the workspace and gix's HTTP transport; its `rustls` TLS
# uses aws-lc-rs, the one rustls provider the workspace builds.
reqwest = { version = "0.13", default-features = false }
object_store = { version = "0.14", default-features = false }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[profile.dev]
# Line tables are enough for test backtraces. Full debug info made every test
# binary hundreds of megabytes, and linking them waited on the disk.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# The vendored crates are path dependencies, so Cargo would compile them
# incrementally like the workspace's own. They never change, yet their
# incremental caches held 1.8 GB of the target directory's 13 GB of them.
incremental = false

# The tests wait on these hashes, which unoptimized code makes slow, so these
# crates alone are optimized in development builds. Measured on 4 x86-64 cores:
# SHA-256 of the built programs, which a test harness hashes to publish them as
# packages and a runner hashes to verify a download, 55 MB/s unoptimized and
# 311 MB/s optimized (the 125 MB debug demi-commands: 2.3 s, then 0.4 s).
[profile.dev.package.sha2]
opt-level = 3

# Password hashing at every sign-up and sign-in: one argon2id hash took
# 0.49 s unoptimized, 23 ms optimized with blake2, which it hashes with.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Small executables, since every paired device downloads each one
# (`builds-and-releases.md` § Build profiles). Measured on aarch64-apple-darwin,
# runner and demi-commands: thin LTO at opt-level 3 36.0 and 23.8 MiB in 79 s;
# these 20.4 and 14.0 MiB in 125 s. Panics unwind: the runner and the command
# services contain a panic to one job or invocation.
[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[patch.crates-io]
chromiumoxide = { path = "vendor/chromiumoxide/chromiumoxide" }
chromiumoxide_cdp = { path = "vendor/chromiumoxide/chromiumoxide_cdp" }
jaq-core = { path = "vendor/jaq/jaq-core" }
argmax = { path = "vendor/argmax/argmax" }
brush-builtins = { path = "vendor/brush/brush-builtins" }
brush-core = { path = "vendor/brush/brush-core" }
uucore = { path = "vendor/uutils-coreutils/uucore" }
uu_cat = { path = "vendor/uutils-coreutils/uu_cat" }
