uu_grep = { path = "vendor/uutils-grep/uu_grep" }
sed = { path = "vendor/uutils-sed/sed" }
findutils = { path = "vendor/uutils-findutils/findutils" }
diffutils = { path = "vendor/uutils-diffutils/diffutils" }

jaq-std = { path = "vendor/jaq/jaq-std" }

ignore = { path = "vendor/ripgrep/ignore" }
