# The lint behind AGENTS.md § Go Readability and Naming. Every number is the
# linter's documented default (lll 120, funlen 60/40, gocognit 30, nestif 5,
# revive argument-limit 8 and max-control-nesting 5); none is this project's
# own. scripts/check.sh runs it for every operating system's files, and
# scripts/fmt.sh applies its formatters.
version: "2"
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - lll
    - funlen
    - gocognit
    - nestif
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: receiver-naming
        - name: early-return
        - name: superfluous-else
        - name: indent-error-flow
        - name: error-naming
        - name: argument-limit
        - name: max-control-nesting
        - name: unexported-return
        - name: redefines-builtin-id
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata/
    rules:
      # A contract type's and field's doc comment is product text: the
      # generated JSON Schema's description, which --help and the model's tool
      # schemas show (docs/architecture/contracts.md). It need not start with
      # the name.
      - path: ^internal/(types|commanddecl|conversationproto|commandproto|runnerproto|machinemanagerproto|webapiproto|commandpackage/[a-z]+/[a-z]+proto|plugin/[a-z]+)/
        linters:
          - revive
        text: "^exported: comment on exported"
      # A scenario test is a long sequence of steps. This exclusion is the
      # project's configuration choice (AGENTS.md says so), not a default.
      - path: _test\.go$
        linters:
          - funlen
          - gocognit
          - nestif
      # A +demi: contract marker is one machine-read line, as a //go:generate
      # directive is: the generator reads an enum's values or a pattern from
      # that line only.
      - linters:
          - lll
        source: '^\s*// \+demi:'
      # A contract doc comment is product text whose line breaks the generator
      # keeps (tools/contractgen contractDescription), so a one-line sentence
      # the model reads cannot be wrapped.
      - path: ^internal/agent/tools/input\.go$
        linters:
          - lll
        source: '^\s*// '
formatters:
  enable:
    - gofumpt
    - golines
    - goimports
  settings:
    # golines wraps at lll's limit, so the formatter and the check agree.
    golines:
      max-len: 120
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata/
