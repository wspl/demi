[package]
name = "demi-shell"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "demi-shell"
path = "src/main.rs"

[dependencies]
rquickjs = { version = "0.11", features = ["loader", "futures", "macro", "array-buffer"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "fs", "process", "time", "io-util", "sync", "signal", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rmp = "0.8"
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"

[features]
default = []
conformance = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.rquickjs-sys]
opt-level = 3
