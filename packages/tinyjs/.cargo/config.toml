# Room in the Mach-O header for the load command `tinyjsc` adds: libsui
# drops that many bytes of padding after the load commands without checking
# they exist (denoland/sui#82), and the linker's default is a few dozen
# bytes. Do not add -fixup_chains: libsui leaves the chained-fixups segment
# count stale (found in denoland/sui#83).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-headerpad,0x2000"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-headerpad,0x2000"]
