[package]
name = "tinyjs"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "tinyjs"
path = "src/lib.rs"

# The runtime: what a target runs.
[[bin]]
name = "tinyjs"
path = "src/main.rs"

# The packer: compiles a bundle to bytecode and injects it into a bare
# tinyjs of any platform. Never shipped to a target.
[[bin]]
name = "tinyjsc"
path = "src/bin/tinyjsc.rs"

[dependencies]
rquickjs = { version = "0.11", features = ["loader", "futures", "macro", "array-buffer"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "fs", "process", "time", "io-util", "sync", "signal", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.6"
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "http1", "tokio"] }
http-body-util = "0.1"
tower-service = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rmpv = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"
libsui = "0.16.4"

[features]
default = []
# The guest build trusts the embedded webpki roots; every other build uses
# the platform verifier.
guest-roots = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.rquickjs-sys]
opt-level = 3
