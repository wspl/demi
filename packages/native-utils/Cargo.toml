[package]
name = "demi-native-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ripgrep = "15.2.0"
jaq = { version = "3.1.1", default-features = false }
uucore = "0.11"
uu_cat = "0.11"

uu_head = "0.11"
uu_tail = "0.11"
uu_wc = "0.11"
uu_ls = "0.11"
uu_cp = "0.11"
uu_mv = "0.11"
uu_rm = "0.11"
uu_mkdir = "0.11"
uu_rmdir = "0.11"
uu_touch = "0.11"
uu_tee = "0.11"
uu_sort = "0.11"
uu_uniq = "0.11"
uu_cut = "0.11"
uu_tr = "0.11"
uu_paste = "0.11"
uu_nl = "0.11"
uu_tac = "0.11"
uu_basename = "0.11"
uu_dirname = "0.11"
uu_realpath = "0.11"
uu_env = "0.11"
uu_seq = "0.11"
uu_date = "0.11"
uu_sleep = "0.11"
uu_mktemp = "0.11"
uu_du = "0.11"
uu_df = "0.11"
uu_od = "0.11"

uu_grep = "0.2.0"
sed = "0.2.0"
findutils = "0.10.0"
diffutils = "0.5.0"

[target.'cfg(unix)'.dependencies]
uu_chmod = "0.11"
uu_chown = "0.11"
uu_stat = "0.11"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
