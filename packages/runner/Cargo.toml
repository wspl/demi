[package]
name = "demi-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
brush-core = "0.5"
brush-builtins = "0.2"
demi-native-utils = { path = "../native-utils" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-service = { path = "../command-service" }
demi-command-loader = { path = "../command-loader" }
demi-command-runtime = { path = "../command-runtime" }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
process-wrap.workspace = true
jsonschema = { version = "0.56", default-features = false }
filetime = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
rmp-serde = "1.3"

[dependencies.demi-native-path]
path = "../native-path"

[features]
test-fixtures = []

[[bin]]
name = "demi-native-fixture"
path = "tests/fixtures/service.rs"
required-features = ["test-fixtures"]
