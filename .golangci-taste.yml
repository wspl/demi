# The checks behind AGENTS.md § Go Readability and Naming, on top of
# .golangci.yml. Every number is the linter's documented default (lll 120,
# funlen 60/40, gocognit 30, nestif 5, revive argument-limit 8 and
# max-control-nesting 5); none is this project's own. scripts/gomig/taste.sh
# runs it. Transitional: when every package passes, it joins .golangci.yml.
version: "2"
linters:
  default: none
  enable:
    - lll
    - funlen
    - gocognit
    - nestif
    - revive
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: receiver-naming
        - name: early-return
        - name: superfluous-else
        - name: indent-error-flow
        - name: error-naming
        - name: argument-limit
        - name: max-control-nesting
        - name: unexported-return
        - name: redefines-builtin-id
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata/
    rules:
      # A scenario test is a long sequence of steps. This exclusion is the
      # project's configuration choice (AGENTS.md says so), not a default.
      - path: _test\.go$
        linters:
          - funlen
          - gocognit
          - nestif
      # A +demi: contract marker is one machine-read line, as a //go:generate
      # directive is: the generator reads an enum's values or a pattern from
      # that line only.
      - linters:
          - lll
        source: '^\s*// \+demi:'

      # As in .golangci.yml: contract doc comments are product text.
      - path: ^internal/(core|declare|framewire|commandwire|runnerwire|machinewire|webapi|cmdpkg/[a-z]+/[a-z]+op|plugins/[a-z]+)/
        linters:
          - revive
        text: "^exported: comment on exported"
formatters:
  enable:
    - gofumpt
    - golines
    - goimports
  settings:
    # golines wraps at lll's limit, so the formatter and the check agree.
    golines:
      max-len: 120
  exclusions:
    generated: strict
    paths:
      - (^|/)testdata/
