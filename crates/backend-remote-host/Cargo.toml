[package]
name = "demi-backend-remote-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
bytes.workspace = true
demi-command-protocol = { path = "../command-protocol" }
demi-command-declarations = { path = "../command-declarations" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
futures-util = { workspace = true, features = ["sink"] }
garde.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
# A stream pipe's WebSocket (`edge`), and the test support's backend end of
# a runner over HTTP and a WebSocket.
axum = { version = "0.8", features = ["ws"], optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"], optional = true }

[dev-dependencies]
# The crate's own tests use its test support and the Host conformance cases.
demi-backend-remote-host = { path = ".", features = ["testing"] }
demi-host-interface = { path = "../host-interface", features = ["testing"] }
schemars.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# The relay of a stream pipe's WebSocket, which the backend's pipe route and
# the test fixture's edge accept.
edge = ["dep:axum"]
# A real runner for one device (`RunnerFixture`) and an in-process fake
# runner (`TestLink`).
testing = ["edge", "dep:sha2", "dep:tempfile", "dep:rustix", "demi-command-protocol/testing", "demi-host-interface/testing"]
