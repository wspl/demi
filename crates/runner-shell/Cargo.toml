[package]
name = "demi-runner-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
brush-core = "0.5"
brush-builtins = "0.2"
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
demi-runner-process = { path = "../runner-process" }
demi-runner-protocol = { path = "../runner-protocol" }
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
futures-util.workspace = true
# `std` for the utilities' child programs (uucore's `context::Control::spawn`).
process-wrap = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

uucore = { version = "0.11", features = ["fs", "mode"] }
uu_cp = "0.11"
uu_mv = "0.11"
uu_rm = "0.11"
uu_mkdir = "0.11"
uu_rmdir = "0.11"
uu_touch = "0.11"
uu_tee = "0.11"
uu_sort = "0.11"
uu_uniq = "0.11"
uu_env = "0.11"
uu_mktemp = "0.11"
uu_ln = "0.11"
uu_link = "0.11"
uu_unlink = "0.11"
uu_truncate = "0.11"
uu_split = "0.11"
uu_csplit = "0.11"
uu_shuf = "0.11"
uu_shred = "0.11"
uu_install = "0.11"
uu_dd = "0.11"
sed = "0.2.0"
findutils = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rlimit = "0.11"
rustix = { version = "1", features = ["event", "process"] }
uu_chmod = "0.11"
uu_chown = "0.11"
uu_chgrp = "0.11"
uu_mkfifo = "0.11"
uu_mknod = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO"] }
