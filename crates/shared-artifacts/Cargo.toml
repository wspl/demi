[package]
name = "demi-shared-artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
# A runner executable's compressed copy, decoded as it streams to an
# installer (`crates/backend-http/src/install.rs`).
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
bytes.workspace = true
futures-util.workspace = true
# `zstd`: a command executable arrives in zstd content coding
# (`crates/backend-runners/src/publication.rs`).
reqwest = { workspace = true, features = ["rustls", "stream", "zstd"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
# The Chrome runtime's archives are tar archives compressed with zstd
# (`crates/plugin-browser/command-chrome/src/driver/installation.rs`).
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zip = { version = "6", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
