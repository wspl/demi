[package]
name = "demi-provider-openai-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test. The tests are in
# tests/openai, so the library needs no test harness of its own.
doctest = false
test = false

[dependencies]
demi-core = { path = "../core" }
demi-provider = { path = "../provider" }
async-stream = "0.3"
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
demi-provider = { path = "../provider", features = ["testing"] }
