[package]
name = "demi-plugin-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-command-declarations = { path = "../command-declarations" }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
demi-plugin-interface = { path = "../plugin-interface", features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
