<!doctype html>
<meta charset="utf-8">
<title>Clipboard fixture</title>
<button id="read" onclick="navigator.clipboard.readText().then(text => { document.querySelector('#text').textContent = text; this.dataset.done = 'true'; })">Read clipboard in page</button>
<button id="write" onclick="navigator.clipboard.writeText('page copied text').then(() => this.dataset.done = 'true')">Copy from page</button>
<pre id="text"></pre>
