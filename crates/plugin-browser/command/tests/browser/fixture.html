<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Native browser test</title>
  <style>
    body { font: 20px sans-serif; }
    button, input { margin: 10px; padding: 15px; }
    #wrap { position: relative; width: 300px; }
    #overlay { position: absolute; inset: 0; background: #eee8; }
  </style>
  <label for="email">电子邮件</label>
  <input id="email" value="replace this">
  <input type="checkbox" aria-label="Unchecked fixture">
  <input type="password" aria-label="Password fixture" value="fixture-secret">
  <button id="normal" onclick="window.normalClicks++">Submit</button>
  <button id="popup" onclick="window.open('about:blank')">Open popup</button>
  <div id="wrap">
    <button id="covered" onclick="window.coveredClicks++">Covered</button>
    <div id="overlay" onclick="window.overlayClicks++"></div>
  </div>
  <button id="disabled" disabled onclick="window.disabledClicks++">Disabled</button>
  <button class="duplicate">Duplicate</button>
  <button class="duplicate">Duplicate</button>
  <button id="check-storage" onclick="window.storageValue = localStorage.getItem('probe')">Check storage</button>
  <button id="arm" onclick="setTimeout(() => { const button = document.createElement('button'); button.id = 'late'; button.textContent = 'Late'; button.onclick = () => window.lateClicks++; document.body.append(button); }, 350)">Create late button</button>
  <script>
    window.normalClicks = 0;
    window.coveredClicks = 0;
    window.overlayClicks = 0;
    window.disabledClicks = 0;
    window.sideEffects = 0;
    window.lateClicks = 0;
    Object.defineProperty(window, 'evil', {
      get() {
        window.sideEffects++;
        return 42;
      }
    });
    addEventListener('beforeunload', event => {
      event.preventDefault();
      event.returnValue = '';
    });
  </script>
</html>
