<!doctype html>
<meta charset="utf-8">
<title>Recording fixture</title>
<style>
  html, body { margin: 0; background: #fff; }
  button { position: absolute; left: 10px; width: 90px; height: 30px; }
  #flash { top: 10px; }
  #slide { top: 50px; }
  #nudge { top: 90px; }
  #square { position: absolute; left: 200px; top: 100px; width: 40px; height: 40px; background: #d00; display: none; }
  #runner { position: absolute; left: 0; top: 200px; width: 30px; height: 30px; background: #00d; }
  #dot { position: absolute; left: 300px; top: 300px; width: 6px; height: 6px; background: #000; }
</style>
<button id="flash">Flash</button>
<button id="slide">Slide</button>
<button id="nudge">Nudge</button>
<div id="square"></div>
<div id="runner"></div>
<div id="dot"></div>
<script>
  // Shows the square for exactly two drawn frames.
  document.getElementById('flash').onclick = () => {
    const square = document.getElementById('square');
    requestAnimationFrame(() => {
      square.style.display = 'block';
      requestAnimationFrame(() => requestAnimationFrame(() => { square.style.display = 'none'; }));
    });
  };
  // Moves the runner one pixel a frame for sixty frames.
  document.getElementById('slide').onclick = () => {
    const runner = document.getElementById('runner');
    let x = 0;
    const step = () => {
      runner.style.left = `${++x}px`;
      if (x < 60) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  // Moves the dot one pixel, once.
  document.getElementById('nudge').onclick = () => {
    document.getElementById('dot').style.left = '301px';
  };
</script>
