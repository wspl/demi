[package]
name = "demi-provider-anthropic-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test. The tests are in
# tests/anthropic, so the library needs no test harness of its own.
doctest = false
test = false
bench = false

[features]
# The body of a request (`testing`), for the tests of what sends this
# provider's requests.
testing = []

[dependencies]
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
async-stream = "0.3"
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
demi-provider-common = { path = "../provider-common", features = ["testing"] }
