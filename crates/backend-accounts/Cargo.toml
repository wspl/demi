[package]
name = "demi-backend-accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Its tests reach the lockout's internals, so they are unit tests and the
# crate has no integration tests (`crates-and-packages.md` § Module layout);
# no doc examples.
doctest = false
bench = false

[dependencies]
demi-backend-database = { path = "../backend-database" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# `std` for `password_hash::Error` as a `std::error::Error`; `password-hash`'s
# `getrandom` gives `SaltString::generate` its operating-system RNG.
argon2 = { version = "0.5", features = ["std"] }
base64.workspace = true
futures-util.workspace = true
hex = "0.4"
# The IANA time zones and the locale canonicalization a reported locale is
# checked against, from ICU4X's compiled data: the same on every machine,
# without a system time zone database.
icu_locale = "2"
icu_time = { version = "2", default-features = false, features = ["compiled_data"] }
jiff.workspace = true
password-hash = { version = "0.5", features = ["getrandom"] }
rand = "0.9"
# The attestation object's own parser, for the authenticator's AAGUID,
# which `webauthn-rs` keeps of no passkey (`passkeys::aaguid`).
serde = { workspace = true }
serde_cbor_2 = "0.13"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
# Every check of a passkey (`backend.md` § Authentication and ownership);
# its features are the control store's, which keeps what it makes.
webauthn-rs = { version = "=0.5.5", default-features = false }
webauthn-rs-core = "=0.5.5"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
