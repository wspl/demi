[package]
name = "demi-preview-rewrite"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# The public suffix list, for the sites the engine computes; the page's
# runtime ships without it.
public-suffix = ["dep:psl"]

[dependencies]
cssparser = "0.38"
data-encoding = "2"
html-escape = "0.2.15"
lol_html = "3"
oxc = { version = "0.153", features = ["semantic", "ast_visit"] }
percent-encoding = "2"
psl = { version = "2", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
string_wizard = { version = "1.2.12", features = ["sourcemap"] }
url = "2"
