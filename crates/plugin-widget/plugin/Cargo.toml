[package]
name = "demi-plugin-widget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-command-package-browser-protocol = { path = "../../plugin-browser/protocol" }
demi-command-protocol = { path = "../../command-protocol" }
demi-command-declarations = { path = "../../command-declarations" }
demi-device-interface = { path = "../../device-interface" }
demi-plugin-interface = { path = "../../plugin-interface" }
demi-shared-types = { path = "../../shared-types" }
# The named character references a page's title reads (`src/page.rs`).
entities = "1"
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
# The vendored libraries' gzip copies (`build.rs`).
flate2 = "1"
