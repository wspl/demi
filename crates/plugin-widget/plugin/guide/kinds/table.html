<!doctype html>
<html>
<head>
<title>Best sellers</title>
</head><body class="p-6">
<div class="text-[11px] font-semibold uppercase tracking-wider text-fg-subtle mb-2">Best sellers · Q3</div>
<div class="divide-y divide-line-subtle" id="t"></div>
<script>
const rows = [['Canvas tote', 3210, 24], ['Desk lamp', 2480, 9], ['Wool socks', 1905, -6], ['Ceramic mug', 1120, 0]]
rows.forEach(([name, n, d], i) => document.getElementById('t').insertAdjacentHTML('beforeend', `
  <div class="grid grid-cols-[1fr_88px_72px_160px] items-center gap-4 py-2.5">
    <div class="flex items-center gap-3"><span class="text-xs font-bold text-fg-subtle tabular-nums w-3">${i + 1}</span><span class="font-semibold text-fg-emphasis">${name}</span></div>
    <div class="text-right font-bold text-fg-emphasis tabular-nums">${n.toLocaleString('en-US')}</div>
    <div class="text-right"><span class="rounded-full px-2 py-0.5 text-xs font-semibold tabular-nums ${d > 0 ? 'text-on-success' : d < 0 ? 'text-on-danger' : 'text-fg-subtle'}" style="background:color-mix(in oklch, ${d > 0 ? 'var(--color-on-success)' : d < 0 ? 'var(--color-on-danger)' : 'var(--color-fg-subtle)'} 14%, transparent)">${d > 0 ? '▲ ' + d : d < 0 ? '▼ ' + -d : '–'}${d ? '%' : ''}</span></div>
    <div class="h-2 rounded-full" style="background:color-mix(in oklch, var(--color-accent-fill) 16%, transparent)"><div class="h-2 rounded-full bg-accent-fill" style="width:${n / 32.1}%"></div></div>
  </div>`))
</script></body></html>
