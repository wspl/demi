<!doctype html>
<html>
<head>
<title>Orders per day</title>
<meta name="demi-frame" content="height: 338px">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script></head><body class="p-6">
<div class="text-[11px] font-semibold uppercase tracking-wider text-fg-subtle" id="hl">Best day</div>
<div class="flex items-baseline gap-2 mt-0.5"><span id="hv" class="text-[34px] leading-none font-bold tracking-tight text-fg-emphasis tabular-nums">Saturday</span></div>
<div id="hn" class="text-xs text-fg-subtle mt-1 mb-4">518 orders · 412 a day on average</div>
<div class="relative h-[170px]"><canvas id="c"></canvas></div>
<script>
const css = getComputedStyle(document.documentElement)
const token = (name) => css.getPropertyValue(name).trim()
// The color at `pct`% opacity; a gradient between two of its opacities stays its hue.
const mix = (color, pct) => `rgb(from ${color} r g b / ${pct / 100})`
Chart.defaults.font.family = token('--font-sans')
Chart.defaults.maintainAspectRatio = false
Chart.defaults.plugins.legend.display = false
// A reader who prefers less motion, and the screenshots, get the chart drawn at once.
if (matchMedia('(prefers-reduced-motion: reduce)').matches) Chart.defaults.animation = false
</script><script>
const head = { label: document.getElementById('hl'), value: document.getElementById('hv'), note: document.getElementById('hn') }
const rest = { label: head.label.textContent, value: head.value.textContent, note: head.note.textContent }
const show = (label, value, note) => { head.label.textContent = label; head.value.textContent = value; head.note.textContent = note }
const reset = () => show(rest.label, rest.value, rest.note)
</script>
<script>
const accent = token('--color-accent-fill'), v = [352, 371, 388, 402, 436, 518, 417], days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
let lit = v.indexOf(Math.max(...v))
const chart = new Chart(c, { type: 'bar',
  data: { labels: days.map((d) => d.slice(0, 3)), datasets: [{ data: v, backgroundColor: (ctx) => ctx.dataIndex === lit ? accent : mix(accent, 30), hoverBackgroundColor: accent, borderRadius: 999, borderSkipped: false, maxBarThickness: 28 }] },
  options: { interaction: { mode: 'index', intersect: false }, plugins: { tooltip: { enabled: false } },
    onHover: (_, els) => { if (!els.length) return; lit = els[0].index; show(days[lit].slice(0, 3).toUpperCase(), v[lit] + ' orders', `${v[lit] > 412 ? '+' : ''}${Math.round((v[lit] / 412 - 1) * 100)}% against the average day`); chart.update('none') },
    scales: { x: { grid: { display: false }, border: { display: false }, ticks: { color: token('--color-fg-subtle'), font: { size: 11, weight: 600 } } }, y: { display: false, beginAtZero: true } } } })
c.addEventListener('mouseleave', () => { lit = v.indexOf(Math.max(...v)); reset(); chart.update('none') })
</script></body></html>
