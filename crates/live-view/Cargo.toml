[package]
name = "demi-live-view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The rate control's tests are the crate's test binary; no doc examples.
test = false
doctest = false
bench = false

[features]
# The simulated path the rate control's tests drive (`live_view::testing`).
testing = []

[dependencies]
bytes.workspace = true
demi-command-sdk = { path = "../command-sdk" }
demi-live-view-protocol = { path = "../live-view-protocol" }
demi-shared-types = { path = "../shared-types" }
garde.workspace = true
serde.workspace = true
serde_json.workspace = true
# Bitrate and DataSize, the units of the estimate ported from str0m (`bwe`).
str0m-proto = { version = "0.7.0", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
demi-live-view = { path = ".", features = ["testing"] }

[[test]]
name = "live-view"
path = "tests/live-view/main.rs"
