[package]
name = "demi-backend-families"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Its test builds the families' providers without an entry, so it is a unit
# test and the crate has no integration tests (`crates-and-packages.md`
# § Module layout); no doc examples.
doctest = false
bench = false

[dependencies]
demi-backend-providers = { path = "../backend-providers" }
demi-core = { path = "../core" }
demi-provider = { path = "../provider" }
demi-provider-anthropic-api = { path = "../provider-anthropic-api" }
demi-provider-claude-code = { path = "../provider-claude-code" }
demi-provider-codex = { path = "../provider-codex" }
demi-provider-google = { path = "../provider-google" }
demi-provider-grok-build = { path = "../provider-grok-build" }
demi-provider-openai-api = { path = "../provider-openai-api" }
demi-web-api = { path = "../web-api" }

[dev-dependencies]
demi-provider = { path = "../provider", features = ["testing"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json.workspace = true
tokio.workspace = true
