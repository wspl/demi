[package]
name = "demi-backend-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the router without a socket, the transfers' byte copies
# and the answers the edge decides by itself, so they are unit tests and the
# crate has no integration tests (`crates-and-packages.md` § Module layout);
# no doc examples.
doctest = false
bench = false

[features]
# The hold of the runners' hellos at the edge's token lookup
# (`Backend::hold_hellos`).
testing = ["demi-backend-user-shard/testing"]

[dependencies]
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol" }
demi-agent-store = { path = "../agent-store" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-expose = { path = "../backend-expose" }
demi-backend-host-access = { path = "../backend-host-access" }
demi-backend-blobs = { path = "../backend-blobs" }
demi-backend-providers = { path = "../backend-providers" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-user-shard = { path = "../backend-user-shard" }
demi-backend-database = { path = "../backend-database" }
demi-backend-page-sync = { path = "../backend-page-sync" }
demi-backend-permissions = { path = "../backend-permissions" }
demi-backend-plugins = { path = "../backend-plugins" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-backend-remote-host = { path = "../backend-remote-host", features = ["edge"] }
demi-provider-common = { path = "../provider-common" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
bytes.workspace = true
cookie = "0.18"
futures-util.workspace = true
garde.workspace = true
http-body = "1"
# The edge serves its connections itself, keeping header case, and the
# expose relay forwards with the HTTP/1 client (`expose.md` § Rationale).
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime = "0.3"
# A local store's command artifact, served as it was stored.
object_store.workspace = true
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
typed-path = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
demi-backend-user-shard = { path = "../backend-user-shard", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
