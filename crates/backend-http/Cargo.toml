[package]
name = "demi-backend-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-core-hosts = { path = "../core-hosts" }
demi-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-user-shard = { path = "../backend-user-shard" }
demi-core = { path = "../core" }
demi-core-api = { path = "../core-api" }
demi-backend-database = { path = "../backend-database" }
demi-core-store = { path = "../core-store" }
demi-core-sync = { path = "../core-sync" }
demi-plugin-host = { path = "../plugin-host" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-runner-client = { path = "../runner-client", features = ["edge"] }
demi-provider-common = { path = "../provider-common" }
demi-provider-relay = { path = "../provider-relay" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-shared-lanes = { path = "../shared-lanes" }
demi-web-api-protocol = { path = "../web-api-protocol" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
bytes.workspace = true
cookie = "0.18"
rand = "0.9"
futures-util.workspace = true
# The edge serves its connections itself, each with an idle deadline and a
# close handle (`crates/backend/src/lib.rs`).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# A local store's command artifact, served as it was stored.
object_store.workspace = true
percent-encoding = "2"
# The send buffer of a runner socket connection.
rustix = { version = "1", features = ["net"] }
serde.workspace = true
serde_json.workspace = true
# The content ETag of the web app files a page revalidates.
sha2 = "0.10"
thiserror.workspace = true
async-stream = "0.3"
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
url = "2"
