[package]
name = "demi-runner-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# A dispatcher with live execution contexts on a connection that channels
# stand in for (`demi_runner_jobs::testing`).
testing = []

[dependencies]
demi-command-protocol = { path = "../command-protocol" }
demi-command-service = { path = "../command-service" }
demi-command-tree = { path = "../command-tree" }
demi-runner-process = { path = "../runner-process" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-runner-services = { path = "../runner-services" }
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-command-service = { path = "../command-service", features = ["testing"] }
demi-runner-jobs = { path = ".", features = ["testing"] }
rmp-serde = "1.3"
serde.workspace = true
tempfile = "3"
# A paused clock for the local endpoint's client test.
tokio = { workspace = true, features = ["test-util"] }
