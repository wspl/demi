[package]
name = "demi-runner-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One test binary, the integration tests' (`ARCHITECTURE.md`); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
demi-command-declarations = { path = "../command-declarations" }
demi-runner-process = { path = "../runner-process" }
demi-shared-link = { path = "../shared-link" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-runner-command-packages = { path = "../runner-command-packages" }
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
