[package]
name = "demi-backend-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the stores' internals, so they are unit tests and the crate
# has no integration tests (`crates-and-packages.md` § Module layout); no doc
# examples.
doctest = false
bench = false

[features]
# A control database with the master account and raw statements behind the
# service's back (`control::testing`), for tests of what the service must
# refuse; and a hold on the commits of the conversations' checkpoints
# (`CommitHold`).
testing = []

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-agent-transcript = { path = "../agent-transcript" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-host-remote = { path = "../host-remote" }
demi-machines-protocol = { path = "../machines-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-shell = { path = "../shell" }
demi-web-api = { path = "../web-api" }
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
hmac = "0.12"
jiff.workspace = true
password-hash = "0.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-agent-store = { path = "../agent-store", features = ["testing"] }
tempfile = "3"
tokio-util.workspace = true
