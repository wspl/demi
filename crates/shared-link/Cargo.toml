[package]
name = "demi-shared-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One test binary, the integration tests' (`ARCHITECTURE.md`); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-runner-protocol = { path = "../runner-protocol" }
futures-util = { workspace = true, features = ["sink"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
# The multiplexer. The workspace takes the release from `vendor/yamux`, which
# adds one setting, and the version is fixed.
yamux = "=0.14.1"

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
demi-shared-link = { path = ".", features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Two connections joined by memory, whose network a test stalls.
testing = []
