[package]
name = "demi-claude"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-claude"
path = "src/main.rs"
test = false

[features]
# Test support: an installer that also downloads from a fixture server on
# 127.0.0.1.
testing = []

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
bytes.workspace = true
demi-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
demi-claude = { path = ".", features = ["testing"] }
demi-shared-artifacts = { path = "../shared-artifacts", features = ["testing"] }
# The program started and driven as a service (`testing::ServiceProcess`).
demi-command-sdk = { path = "../command-sdk", features = ["testing"] }
futures-util.workspace = true
sha2 = "0.10"
