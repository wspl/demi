[package]
name = "demi-plugin-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Tested through the plugins that call it; no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-shared-types = { path = "../shared-types" }
# What an input image is, read from its header.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# A reset time in the user's time zone.
jiff = { workspace = true, features = ["tz-system", "tzdb-bundle-platform"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
