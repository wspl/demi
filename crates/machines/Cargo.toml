[package]
name = "demi-machines"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test.
doctest = false

[[bin]]
name = "demi-machines"
path = "src/main.rs"

[features]
# Acceptance builds: `DEMI_MACHINES_FAULT=<point>` aborts the process at that
# point (`managed-hosts.md` § Verification).
fault-injection = []

[dependencies]
demi-artifact = { path = "../artifact" }
demi-machines-protocol = { path = "../machines-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
clap = { version = "4", features = ["derive", "env"] }
fs-err = "3"
futures-util.workspace = true
ipnet = "2"
nftables = "0.6"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
serde.workspace = true
serde_json.workspace = true
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12", default-features = false, features = ["ioctl", "loop_device", "std"] }
rtnetlink = "0.23"
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }
sd-notify = "0.5"
sha2 = "0.10"
walkdir = "2"

# sha2's ARM hardware backend is opt-in; base import hashes the whole archive.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
