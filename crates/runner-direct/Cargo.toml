[package]
name = "demi-runner-direct"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-runner-protocol = { path = "../runner-protocol" }
bytes.workspace = true
# The random bytes of a speed test, which only need to be incompressible.
fastrand = "2"
futures-util.workspace = true
garde.workspace = true
# The interfaces a runner offers its local network addresses on
# (`direct-channel.md` § Making the channel): up, broadcast and
# point-to-point, on every platform a runner runs on.
if-addrs = "0.15"
serde.workspace = true
serde_json.workspace = true
# WebRTC data channels, sans IO: ICE, DTLS and SCTP. Its aws-lc-rs crypto is
# the one provider the workspace builds.
thiserror.workspace = true
str0m = { version = "0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# A STUN request's transaction id, which only has to be unpredictable.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-runner-direct = { path = ".", features = ["testing"] }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types" }
tokio = { workspace = true, features = ["test-util"] }

[features]
# A page in process that connects to a runner's peers, for the tests of
# this crate and the backend's.
testing = []
