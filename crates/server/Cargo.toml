[package]
name = "demi-server"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[[bin]]
name = "demi-server"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
demi-backend-database = { path = "../backend-database" }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
# The next runner release's record and the backend's management
# socket.
demi-runner-protocol = { path = "../runner-protocol" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-shared-cli = { path = "../shared-cli" }
demi-shared-types = { path = "../shared-types" }
# `GET /api/update`, which an upgrade asks while the backend starts.
demi-web-api-protocol = { path = "../web-api-protocol" }
dotenvy = "0.15"
jiff.workspace = true
rustix = { version = "1", features = ["fs", "process"] }
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url = "2"
which = "8"
zstd = { version = "0.13", default-features = false }
