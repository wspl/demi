[package]
name = "demi-runner-process"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-artifact = { path = "../artifact" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-service = { path = "../command-service" }
demi-runner-protocol = { path = "../runner-protocol" }
bytes.workspace = true
futures-util.workspace = true
# The line counts of a change, the diff gix's blob diff is.
gix-imara-diff = "0.2.5"
process-wrap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# The open-file limit, raised at start and restored in children (`runner.md` § Load).
rlimit = "0.11"
rustix = { version = "1", features = ["fs", "process"] }

# The runner's umask, read without changing it (`src/process.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
