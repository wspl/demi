[package]
name = "demi-runner-process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
demi-runner-protocol = { path = "../runner-protocol" }
bytes.workspace = true
futures-util.workspace = true
# The line counts of a change, the diff gix's blob diff is.
process-wrap.workspace = true
# HTTP/2 where the backend's edge offers it over TLS, so concurrent pipes
# share one connection (`crates/runner-host/src/lib.rs`); plain HTTP stays
# HTTP/1.1.
reqwest = { workspace = true, features = ["http2", "rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
# A private local socket's directory (`src/local_socket.rs`).
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
# Stream pipes, which the runner sends over a WebSocket (`crates/runner-host/src/lib.rs`).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# The pipes a spawned process inherits besides its standard streams
# (`crates/runner-host/src/lib.rs`).
command-fds = "0.3"
# A child's SIGHUP ignored for `nohup`, set between fork and exec, and on
# Apple an ended child's processor time, which only proc_pid_rusage reads
# (`src/process.rs`).
libc = "0.2"
# The open-file limit, raised at start and restored in children (`crates/command-sdk/src/descriptors.rs`).
rlimit = "0.11"
rustix = { version = "1", features = ["fs", "process"] }
# The environments of the user's processes, where a stop finds a job's
# processes that left its groups (`crates/runner-shell/src/job.rs`).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# The runner's umask, read without changing it, and an ended child's
# processor time (`src/process.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

# proc_pid_rusage's Mach time units (`src/process.rs`).
[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.7"

[target.'cfg(windows)'.dependencies]
# A private local socket's pipe, which only its account opens (`src/local_socket.rs`).
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
