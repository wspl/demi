[package]
name = "demi-runner-process"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
demi-runner-protocol = { path = "../runner-protocol" }
bytes.workspace = true
futures-util.workspace = true
# The line counts of a change, the diff gix's blob diff is.
gix-imara-diff = "0.2.5"
process-wrap.workspace = true
# HTTP/2 where the backend's edge offers it over TLS, so concurrent pipes
# share one connection (`runner.md` § Host operations); plain HTTP stays
# HTTP/1.1.
reqwest = { workspace = true, features = ["http2", "rustls", "stream"] }
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Stream pipes, which the runner sends over a WebSocket (`runner.md` § Host operations).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# The open-file limit, raised at start and restored in children (`runner.md` § Load).
rlimit = "0.11"
rustix = { version = "1", features = ["fs", "process"] }

# The runner's umask, read without changing it (`src/process.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
