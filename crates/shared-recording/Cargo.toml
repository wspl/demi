[package]
name = "demi-shared-recording"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Its tests run a recording through its own interface with a real encoder, so
# they are unit tests and the crate has no integration tests
# (`ARCHITECTURE.md`). No doc examples.
doctest = false
bench = false

[features]
# OpenH264 built from its source, for the tests and for the programs' tests
# that record without Cisco's download.
testing = ["demi-shared-openh264/testing", "demi-shared-h264/testing"]

[dependencies]
demi-shared-h264 = { path = "../shared-h264" }
demi-shared-openh264 = { path = "../shared-openh264" }
demi-shared-recording-protocol = { path = "../shared-recording-protocol" }
demi-shared-types = { path = "../shared-types" }
image = { version = "0.25", default-features = false, features = ["png"] }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
demi-shared-h264 = { path = "../shared-h264", features = ["testing"] }
demi-shared-openh264 = { path = "../shared-openh264", features = ["testing"] }
demi-shared-types = { path = "../shared-types", features = ["mp4"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
