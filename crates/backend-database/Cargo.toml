[package]
name = "demi-backend-database"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# Its tests reach the stores' internals, so they are unit tests and the crate
# has no integration tests (`crates-and-packages.md` § Module layout); no doc
# examples.
doctest = false
bench = false

[features]
# A control database with the master account and raw statements behind the
# service's back (`control::testing`), for tests of what the service must
# refuse; and a hold on the commits of the conversations' checkpoints
# (`CommitHold`).
testing = []

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-backend-remote-host = { path = "../backend-remote-host" }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
demi-plugin-interface = { path = "../plugin-interface" }
base64.workspace = true
bytes.workspace = true
comrak = { version = "0.56", default-features = false }
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
hmac = "0.12"
jiff.workspace = true
password-hash = "0.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
tracing.workspace = true
# The server log is a `tracing` layer over the spans' recorded fields.
tracing-subscriber = { workspace = true, features = ["registry"] }
uuid = { version = "1", features = ["v4"] }
# The passkeys and their challenges the control store keeps
# (`storage.md` § Passwords and credentials at rest), as `webauthn-rs`
# encodes them: its state serialization stores a challenge between a
# sign-in's two requests, which may reach different workers, and its
# credential internals give a passkey's backup state.
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
# `webauthn-rs` signs and verifies with OpenSSL, which it offers no
# alternative to; built from source, so that the static Linux builds of the
# backend and `demi-server` need no system OpenSSL. No runner, command
# package or Host program depends on this crate.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
demi-provider-common = { path = "../provider-common", features = ["testing"] }
demi-agent-store = { path = "../agent-store", features = ["testing"] }
tempfile = "3"
tokio-util.workspace = true
