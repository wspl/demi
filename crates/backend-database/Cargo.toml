[package]
name = "demi-backend-database"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
demi-shared-types = { path = "../shared-types", features = ["tracing"] }
demi-shared-gates = { path = "../shared-gates" }
demi-runner-client = { path = "../runner-client" }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-plugin-host = { path = "../plugin-host" }
base64.workspace = true
bytes.workspace = true
comrak = { version = "0.56", default-features = false }
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
hmac = "0.12"
jiff.workspace = true
password-hash = "0.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
tracing.workspace = true
# `DEMI_LOG`'s targets, which a page's lines are held to (`server_log`).
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4"] }
# The contents and the records' bodies are stored compressed; the records of a
# conversation share a dictionary trained on its own (`records.rs`).
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
# The passkeys and their challenges the control store keeps
# (`crates/backend/src/config/secret.rs`), as `webauthn-rs` encodes them.
#
# - Its state serialization stores a challenge between a sign-in's two requests,
#   which may reach different workers.
# - Its credential internals give a passkey's backup state.
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
# `webauthn-rs` signs and verifies with OpenSSL, which it offers no
# alternative to; built from source, so that the static Linux builds of the
# backend and `demi-server` need no system OpenSSL. No runner, command
# package or Host program depends on this crate.
openssl = { version = "0.10", features = ["vendored"] }
