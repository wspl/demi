[package]
name = "demi-runner-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
bytes.workspace = true
demi-command-protocol = { path = "../command-protocol" }
demi-command-declarations = { path = "../command-declarations" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
futures-util = { workspace = true, features = ["sink"] }
garde.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
# A stream pipe's WebSocket (`edge`).
axum = { version = "0.8", features = ["ws"], optional = true }

[features]
# The relay of a stream pipe's WebSocket, which the backend's pipe route
# accepts.
edge = ["dep:axum"]
