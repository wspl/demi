// The part of the Android Emulator's `emulator_controller.proto` (emulator
// 36.6, `<sdk>/emulator/lib/`) that Demi's Android driver uses
// (`crates/plugin-mobile/command/src/android/mod.rs`): the service's name, its methods and their
// messages keep the original's names and field numbers; the fields and
// methods Demi does not use are left out, which protobuf's unknown fields
// allow.

syntax = "proto3";

package android.emulation.control;

import "google/protobuf/empty.proto";

service EmulatorController {
    rpc setPhysicalModel(PhysicalModelValue) returns (google.protobuf.Empty) {}
    rpc sendKey(KeyboardEvent) returns (google.protobuf.Empty) {}
    rpc sendTouch(TouchEvent) returns (google.protobuf.Empty) {}
    rpc getStatus(google.protobuf.Empty) returns (EmulatorStatus) {}
    rpc getScreenshot(ImageFormat) returns (Image) {}
    rpc streamScreenshot(ImageFormat) returns (stream Image) {}
    rpc setVmState(VmRunState) returns (google.protobuf.Empty) {}
    // The current states at once, then each change: here, that the guest
    // finished booting.
    rpc streamNotification(google.protobuf.Empty) returns (stream Notification) {}
}

message BootCompletedNotification {
    int32 time = 1;
}

message Notification {
    oneof type {
        BootCompletedNotification booted = 5;
    }
}

message VmRunState {
    enum RunState {
        UNKNOWN = 0;
        RUNNING = 1;
        RESTORE_VM = 2;
        PAUSED = 3;
        SAVE_VM = 4;
        SHUTDOWN = 5;
        TERMINATE = 7;
        RESET = 9;
        INTERNAL_ERROR = 10;
        RESTART = 11;
        START = 12;
        STOP = 13;
    }
    RunState state = 1;
}

message ParameterValue {
    repeated float data = 1 [packed = true];
}

message PhysicalModelValue {
    enum PhysicalType {
        POSITION = 0;
        // Angles in degrees, [x, y, z].
        ROTATION = 1;
    }
    enum Interpolation {
        SMOOTH = 0;
        STEP = 1;
    }
    PhysicalType target = 1;
    ParameterValue value = 3;
    Interpolation interpolation = 4;
}

message KeyboardEvent {
    enum KeyCodeType {
        Usb = 0;
        Evdev = 1;
        XKB = 2;
        Win = 3;
        Mac = 4;
    }
    enum KeyEventType {
        keydown = 0;
        keyup = 1;
        keypress = 2;
    }
    KeyCodeType codeType = 1;
    KeyEventType eventType = 2;
    int32 keyCode = 3;
    // A key by its W3C name, such as "GoHome", "GoBack" or "Power".
    string key = 4;
}

message Touch {
    int32 x = 1;
    int32 y = 2;
    int32 identifier = 3;
    // Non-zero while the finger touches; zero lifts it.
    int32 pressure = 4;
}

message TouchEvent {
    repeated Touch touches = 1;
    int32 display = 2;
}

message Entry {
    string key = 1;
    string value = 2;
}

message EntryList {
    repeated Entry entry = 1;
}

message EmulatorStatus {
    string version = 1;
    uint64 uptime = 2;
    // Whether the guest finished booting.
    bool booted = 3;
    // The hardware configuration, such as hw.lcd.density, as emulators up
    // to at least 36.6 send it; the interface calls it deprecated for
    // platformConfig, which those leave empty.
    EntryList hardwareConfig = 5;
    // The same, where a later emulator sends it.
    map<string, string> platformConfig = 8;
}

message Rotation {
    enum SkinRotation {
        PORTRAIT = 0;           // 0 degrees
        LANDSCAPE = 1;          // 90 degrees
        REVERSE_PORTRAIT = 2;   // -180 degrees
        REVERSE_LANDSCAPE = 3;  // -90 degrees
    }
    SkinRotation rotation = 1;
}

message ImageFormat {
    enum ImgFormat {
        PNG = 0;
        RGBA8888 = 1;
        RGB888 = 2;
    }
    ImgFormat format = 1;
    // [Output Only] Which way the device is turned; the picture is turned
    // with it.
    Rotation rotation = 2;
    // The most the picture may have; it keeps the screen's aspect ratio.
    uint32 width = 3;
    uint32 height = 4;
    uint32 display = 5;
}

message Image {
    ImageFormat format = 1;
    // The pixels, rows from the top down.
    bytes image = 4;
    uint32 seq = 5;
    uint64 timestampUs = 6;
}
