[package]
name = "demi-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One test binary, the integration tests' (`ARCHITECTURE.md`); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-mobile"
path = "src/main.rs"
test = false

[features]
# A driver the tests script (`testing`), and the iOS helper's framing for
# a test that plays the helper.
testing = ["tonic/server", "tonic/router", "openh264/source"]

[dependencies]
bytes.workspace = true
demi-command-package-mobile-protocol = { path = "../protocol" }
demi-command-protocol = { path = "../../command-protocol" }
demi-command-sdk = { path = "../../command-sdk" }
demi-live-view = { path = "../../live-view" }
demi-live-view-protocol = { path = "../../live-view-protocol" }
demi-shared-artifacts = { path = "../../shared-artifacts" }
demi-shared-cli = { path = "../../shared-cli", features = ["host-allocator"] }
demi-shared-types = { path = "../../shared-types" }
base64.workspace = true
futures-util.workspace = true
garde.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The Android driver (`crates/plugin-mobile/command/src/android/mod.rs`): the
# emulator's gRPC interface,
# its JWT signed with ES256, the UI tree's XML, and Cisco's OpenH264 for its
# frames, loaded at run time once downloaded from Cisco and checked; the
# tests build OpenH264 from its source instead (`testing`).
aws-lc-rs = "1"
bzip2 = "0.6"
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
prost = "0.14"
http.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify = "8.2"
roxmltree = "0.21"
# The screen's corners as SystemUI draws them
# (`crates/plugin-mobile/command/src/live.rs`): the rounded-corner drawable
# read from its APK, copied to a
# temporary file and read by its central directory, its path's shape, and
# Android Studio's device art, decoded and drawn.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
kurbo = "0.13"
tempfile = "3"
zip = { version = "6", default-features = false, features = ["deflate"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel"] }
tonic-prost = "0.14"
# The macOS version the iOS helper needs (`crates/plugin-mobile/command/src/ios/mod.rs`), and the
# emulators' processes: whether one runs, and since when.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# The end of an emulator's process, which is not this program's child, as
# the system announces it (`crates/plugin-mobile/command/src/android/mod.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
kqueue = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
# The iOS helper's build: its downloads' digests, idb's source archive, and
# the archive the program carries (`crates/plugin-mobile/command/src/ios/mod.rs`).
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
# The emulator's gRPC interface, compiled without protoc.
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
bzip2 = "0.6"
demi-command-package-mobile-protocol = { path = "../protocol" }
demi-command-sdk = { path = "../../command-sdk", features = ["testing"] }
demi-mobile = { path = ".", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
