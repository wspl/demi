[package]
name = "demi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# Scripted provider runtimes and a test client that drives a connection
# (`agent::testing`), for the tests of the agent and of what sits above it,
# with the test support of the agent's lower crates and the view of the
# actions waiting at a tree's admission (`demi-gates/testing`).
testing = ["demi-agent-tools/testing", "demi-gates/testing", "demi-provider/testing"]

[dependencies]
bytes.workspace = true
demi-agent-protocol = { path = "../agent-protocol" }
demi-agent-session = { path = "../agent-session" }
demi-agent-store = { path = "../agent-store" }
demi-agent-tools = { path = "../agent-tools" }
demi-agent-transcript = { path = "../agent-transcript" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-provider = { path = "../provider" }
demi-shell = { path = "../shell" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The crate's own tests use its test support and the scripted provider
# runtimes.
demi-agent = { path = ".", features = ["testing"] }
demi-agent-store = { path = "../agent-store", features = ["testing"] }
demi-agent-tools = { path = "../agent-tools", features = ["testing"] }
demi-agent-transcript = { path = "../agent-transcript", features = ["testing"] }
demi-provider = { path = "../provider", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
# The compaction fixture's harness (`fixtures/compaction/README.md`) talks
# to a real model. It is an example, so every build of the one selection
# compiles it and no test runs it; its provider is a dev-dependency, so the
# library never links one.
demi-provider-openai-api = { path = "../provider-openai-api" }
flate2 = "1"
reqwest = { version = "0.12", default-features = false }

[[example]]
name = "compaction-fixture"
path = "fixtures/compaction/main.rs"
