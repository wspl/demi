[package]
name = "demi-command-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its behavior is tested through the SDK, in command-sdk's tests
# (`crates-and-packages.md` § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# The programs a test finds beside itself and the runner's native fixture's
# operations (`command_protocol::testing`).
testing = []

[dependencies]
bytes.workspace = true
garde.workspace = true
# Reads a medium's size from its header (`runtime.md` § Media the model
# views): only the codecs of the types a model reads.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Reads a video's size and length from its container's header: MP4 and
# QuickTime, and WebM, in one parser.
nom-exif = "3.8"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
serde_with.workspace = true
sha2 = "0.10"
thiserror.workspace = true
url = "2"
