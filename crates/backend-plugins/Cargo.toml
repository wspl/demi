demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-shared-types = { path = "../shared-types" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# The OAuth pieces every sign-in meets.
demi-provider-common = { path = "../provider-common" }
base64.workspace = true
futures-util.workspace = true
jiff.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["rustls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
