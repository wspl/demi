[package]
name = "demi-browser-cdp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its behavior is tested through the program's Chrome tests
# (`crates-and-packages.md` § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# Evaluation in a target no command addresses, for the Chrome tests.
testing = []

[dependencies]
chromiumoxide = "=0.9.1"
demi-browser-driver = { path = "../browser-driver" }
demi-browser-protocol = { path = "../browser-protocol" }
demi-browser-tabs = { path = "../browser-tabs" }
demi-command-service = { path = "../command-service" }
futures-util.workspace = true
# Validate page tool schemas and the pinned CDP protocol without fetching external refs (MIT).
jsonschema = { version = "0.56", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
