[package]
name = "demi-browser"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-browser"
path = "src/main.rs"
test = false

[dependencies]
bytes.workspace = true
demi-command-package-browser-chrome = { path = "../command-package-browser-chrome" }
demi-command-package-browser-preview = { path = "../command-package-browser-preview" }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
futures-util.workspace = true
png = "0.18"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
# The browser libraries' test support, for the Chrome tests.
demi-command-package-browser-chrome = { path = "../command-package-browser-chrome", features = ["testing"] }
demi-command-sdk = { path = "../command-sdk", features = ["testing"] }
regex = "1"
# The repair tests fetch from their fixture site.
reqwest = { workspace = true, features = ["rustls", "stream"] }
tempfile = "3"

# The retirement tests read the process table.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
