<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Popups</title>
  <button id="open" onclick="window.open('about:blank')">Open a tab</button>
  <button id="keep" onclick="window.opened = window.open('about:blank')">Open a tab and keep it</button>
  <button id="stay" onclick="window.stays = (window.stays || 0) + 1">Stay</button>
</html>
