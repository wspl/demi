[package]
name = "demi-agent-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# An in-memory tree store and blob namespace, the tree store contract's cases
# and the values the agent crates' tests build on (`agent_store::testing`).
testing = ["dep:sha2"]

[dependencies]
bytes.workspace = true
demi-command-protocol = { path = "../command-protocol" }
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
demi-host-interface = { path = "../host-interface" }
futures-util.workspace = true
garde.workspace = true
# Fits an image as it enters a transcript (`runtime.md` § Images in the
# transcript): only the codecs of the types a model reads, and no threads.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde.workspace = true
sha2 = { version = "0.10", optional = true }
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
demi-agent-store = { path = ".", features = ["testing"] }
serde_json.workspace = true
