[package]
name = "demi-agent-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# An in-memory tree store and blob namespace, the tree store contract's cases
# and the values the agent crates' tests build on (`agent_store::testing`).
testing = ["dep:sha2"]

[dependencies]
demi-agent-protocol = { path = "../agent-protocol" }
demi-core = { path = "../core" }
demi-provider = { path = "../provider" }
demi-shell = { path = "../shell" }
futures-util.workspace = true
garde.workspace = true
# Fits an image as it enters a transcript (`runtime.md` § Images in the
# transcript): only the codecs of the types a model reads, and no threads.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
sha2 = { version = "0.10", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
demi-agent-store = { path = ".", features = ["testing"] }
