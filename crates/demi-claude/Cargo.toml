[package]
name = "demi-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false

[[bin]]
name = "demi-claude"
path = "src/main.rs"
test = false

[features]
# Test support: an installer that also downloads from a fixture server on
# 127.0.0.1.
testing = []

[dependencies]
demi-artifact = { path = "../artifact" }
bytes.workspace = true
demi-claude-protocol = { path = "../claude-protocol" }
demi-command-service = { path = "../command-service" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
demi-claude = { path = ".", features = ["testing"] }
demi-artifact = { path = "../artifact", features = ["testing"] }
# The program started and driven as a service (`testing::ServiceProcess`).
demi-command-service = { path = "../command-service", features = ["testing"] }
futures-util.workspace = true
sha2 = "0.10"
