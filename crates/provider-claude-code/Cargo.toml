[package]
name = "demi-provider-claude-code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
test = false
bench = false

[features]
# The session a new process resumes (`testing`), which the compaction tests
# compare a summary's replay with.
testing = []

[dependencies]
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
demi-host-interface = { path = "../host-interface" }
# The build version the SDK MCP server names.
demi-shared-artifacts = { path = "../shared-artifacts" }
async-stream = "0.3"
base64.workspace = true
bytes.workspace = true
# The in-memory transport of the SDK MCP server: rmcp takes any sink and
# stream of its messages, and these channels are both.
futures-channel = { version = "0.3", features = ["sink"] }
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls", "stream"] }
# The SDK MCP server; `local` runs its service loop and handlers on the
# user's shard, which is one thread.
rmcp = { version = "3.4", default-features = false, features = ["local", "server"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
