[package]
name = "demi-preview-rewrite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `bun xtask preview-runtime` builds it for wasm32-unknown-unknown
# (`builds-and-releases.md` § Preview runtime); on the host it compiles to
# a library nothing loads. No tests of its own: it adds no behavior to
# `preview-rewrite`, whose tests cover it.
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[dependencies]
demi-preview-rewrite = { path = "../preview-rewrite" }
serde_json.workspace = true
wasm-bindgen.workspace = true
