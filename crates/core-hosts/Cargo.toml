[package]
name = "demi-core-hosts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-core-store = { path = "../core-store" }
demi-core-sync = { path = "../core-sync" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-gates = { path = "../shared-gates" }
demi-runner-client = { path = "../runner-client", features = ["edge"] }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
