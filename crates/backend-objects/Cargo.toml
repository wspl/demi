[package]
name = "demi-backend-objects"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Its tests reach the record of blob uses, so they are unit tests and the
# crate has no integration tests (`crates-and-packages.md` § Module layout);
# no doc examples.
doctest = false
bench = false

[features]
# An S3 fake (`fake_s3::FakeS3`) and an object store that counts what reaches
# it (`counting::ObjectCounts`).
testing = ["dep:async-trait", "dep:axum"]

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-core = { path = "../core" }
demi-web-api = { path = "../web-api" }
# Implements `object_store`'s trait for the counting store of `testing`.
async-trait = { version = "0.1", optional = true }
# Serves the S3 fake of `testing`.
axum = { version = "0.8", optional = true }
bytes.workspace = true
futures-util.workspace = true
jiff.workspace = true
object_store = { version = "0.13", default-features = false, features = ["aws", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
tempfile = "3"
