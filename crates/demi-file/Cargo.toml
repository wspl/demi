[package]
name = "demi-file"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false

[[bin]]
name = "demi-file"
path = "src/main.rs"
test = false

[dependencies]
bytes.workspace = true
demi-artifact = { path = "../artifact" }
demi-command-service = { path = "../command-service" }
demi-core = { path = "../core" }
demi-file-protocol = { path = "../file-protocol" }
demi-gates = { path = "../gates" }
regex = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The program started and driven as a service (`testing::ServiceProcess`).
demi-command-service = { path = "../command-service", features = ["testing"] }
serde_json.workspace = true
tempfile = "3"
