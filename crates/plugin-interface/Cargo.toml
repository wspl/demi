[package]
name = "demi-plugin-interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# The JSON loopback transport and a port over an rpc transport, which every
# plugin's tests run through.
testing = ["dep:tokio"]

[dependencies]
demi-command-declarations = { path = "../command-declarations" }
demi-host-interface = { path = "../host-interface" }
demi-shared-types = { path = "../shared-types" }
demi-web-api-protocol = { path = "../web-api-protocol" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio-util.workspace = true
# `TestDemi::until`, which wakes at each port message.
tokio = { workspace = true, optional = true }

[dev-dependencies]
demi-plugin-interface = { path = ".", features = ["testing"] }
demi-host-interface = { path = "../host-interface", features = ["testing"] }
schemars.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
