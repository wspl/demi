[package]
name = "demi-plugin-image"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-host-interface = { path = "../../host-interface" }
demi-plugin-interface = { path = "../../plugin-interface" }
demi-plugin-media = { path = "../../plugin-media" }
demi-shared-types = { path = "../../shared-types", features = ["whole-image"] }
# What an image is, its size and whether it has an alpha channel, read
# from its header.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# The image's decoding runs on the blocking pool.
tokio = { workspace = true, features = ["rt"] }
