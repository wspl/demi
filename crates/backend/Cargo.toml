[package]
name = "demi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test.
doctest = false

[dependencies]
demi-agent = { path = "../agent" }
demi-agent-protocol = { path = "../agent-protocol" }
demi-artifact = { path = "../artifact" }
demi-builtin-protocol = { path = "../builtin-protocol" }
demi-coding-agent = { path = "../coding-agent" }
demi-command-service = { path = "../command-service" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-host-remote = { path = "../host-remote" }
demi-provider = { path = "../provider" }
demi-provider-anthropic-api = { path = "../provider-anthropic-api" }
demi-provider-codex = { path = "../provider-codex" }
demi-provider-google = { path = "../provider-google" }
demi-provider-grok-build = { path = "../provider-grok-build" }
demi-provider-openai-api = { path = "../provider-openai-api" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-shell = { path = "../shell" }
demi-web-api = { path = "../web-api" }
aes-gcm = "0.10"
# `std` for `password_hash::Error` as a `std::error::Error`; `password-hash`'s
# `getrandom` gives `SaltString::generate` its operating-system RNG.
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
data-encoding = "2"
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
icu_collator = "2"
# The IANA time zones and the locale canonicalization a reported locale is
# checked against, from ICU4X's compiled data: the same on every machine,
# without a system time zone database.
icu_locale = "2"
icu_time = { version = "2", default-features = false, features = ["compiled_data"] }
jiff.workspace = true
mime = "0.3"
object_store = { version = "0.13", default-features = false, features = ["aws", "fs"] }
password-hash = { version = "0.5", features = ["getrandom"] }
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
serde_with.workspace = true
sha2 = "0.10"
shlex = "2"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
typed-path = "0.12"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-agent = { path = "../agent", features = ["testing"] }
demi-host-remote = { path = "../host-remote", features = ["testing"] }
demi-provider = { path = "../provider", features = ["testing"] }
demi-shell = { path = "../shell", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
