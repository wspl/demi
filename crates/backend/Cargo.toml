[package]
name = "demi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test.
doctest = false

[dependencies]
demi-artifact = { path = "../artifact" }
demi-command-service = { path = "../command-service" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-provider = { path = "../provider" }
demi-provider-anthropic-api = { path = "../provider-anthropic-api" }
demi-web-api = { path = "../web-api" }
aes-gcm = "0.10"
# `std` for `password_hash::Error` as a `std::error::Error`; `password-hash`'s
# `getrandom` gives `SaltString::generate` its operating-system RNG.
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18"
futures-util.workspace = true
garde.workspace = true
hashlink = "0.12"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
icu_collator = "2"
# The IANA time zones and the locale canonicalization a reported locale is
# checked against, from ICU4X's compiled data: the same on every machine,
# without a system time zone database.
icu_locale = "2"
icu_time = { version = "2", default-features = false, features = ["compiled_data"] }
jiff.workspace = true
object_store = { version = "0.13", default-features = false, features = ["fs"] }
password-hash = { version = "0.5", features = ["getrandom"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
rusqlite_migration = "2.6"
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
serde_with.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = "0.8"
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-provider = { path = "../provider", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
