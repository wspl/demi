[package]
name = "demi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-backend"
path = "src/main.rs"
test = false

[features]
# A hold on the commits of the conversations' checkpoints (`CommitHold`), for
# the scenarios that stop a save at its commit, a conversation's file gate
# with the view of the entrants waiting at it (`Backend::file_gate`), an
# object store that counts what reaches it (`ObjectCounts`), and the holds of
# the runners' hellos and the pages' synchronization channels (`StepHold`).
testing = [
  "demi-backend-http/testing",
  "demi-backend-blobs/testing",
  "demi-backend-user-shard/testing",
  "demi-backend-database/testing",
  "demi-shared-gates/testing",
]

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-http = { path = "../backend-http" }
demi-backend-expose = { path = "../backend-expose" }
demi-backend-families = { path = "../backend-families" }
demi-backend-host-access = { path = "../backend-host-access" }
demi-backend-blobs = { path = "../backend-blobs" }
demi-backend-providers = { path = "../backend-providers" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-user-shard = { path = "../backend-user-shard" }
demi-backend-database = { path = "../backend-database" }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-command-declarations = { path = "../command-declarations" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-provider-common = { path = "../provider-common" }
demi-web-api-protocol = { path = "../web-api-protocol" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = { version = "2", features = ["serde"] }

[dev-dependencies]
demi-agent-server = { path = "../agent-server", features = ["testing"] }
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol" }
demi-agent-store = { path = "../agent-store", features = ["testing"] }
demi-agent-tools = { path = "../agent-tools", features = ["testing"] }
demi-backend = { path = ".", features = ["testing"] }
demi-backend-runners = { path = "../backend-runners", features = ["testing"] }
demi-backend-user-shard = { path = "../backend-user-shard", features = ["testing"] }
demi-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
demi-command-protocol = { path = "../command-protocol", features = ["testing"] }
demi-command-package-file-protocol = { path = "../command-package-file-protocol" }
demi-backend-remote-host = { path = "../backend-remote-host", features = ["testing"] }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
demi-provider-common = { path = "../provider-common", features = ["testing"] }
demi-provider-claude-code = { path = "../provider-claude-code" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface", features = ["testing"] }
bytes.workspace = true
# The upload and retention scenarios look for images' base64 in what a
# provider was sent.
data-encoding = "2"
futures-util.workspace = true
jiff.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
# The account scenarios store password hashes of their own; `password-hash`'s
# `getrandom` gives `SaltString::generate` its operating-system RNG.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# The scenarios change and read rows behind the backend's back.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# The expose scenarios read HTTP heads byte for byte, header case included.
httparse = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
