[package]
name = "demi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-backend"
path = "src/main.rs"
test = false

[features]
# A hold on the commits of the conversations' checkpoints (`CommitHold`), for
# the scenarios that stop a save at its commit, a conversation's file gate
# with the view of the entrants waiting at it (`Backend::file_gate`), an
# object store that counts what reaches it (`ObjectCounts`), and the holds of
# the runners' hellos and the pages' synchronization channels (`StepHold`).
testing = [
  "demi-backend-edge/testing",
  "demi-backend-objects/testing",
  "demi-backend-shard/testing",
  "demi-backend-storage/testing",
  "demi-gates/testing",
]

[dependencies]
demi-artifact = { path = "../artifact" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-edge = { path = "../backend-edge" }
demi-backend-expose = { path = "../backend-expose" }
demi-backend-families = { path = "../backend-families" }
demi-backend-host-access = { path = "../backend-host-access" }
demi-backend-objects = { path = "../backend-objects" }
demi-backend-providers = { path = "../backend-providers" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-shard = { path = "../backend-shard" }
demi-backend-storage = { path = "../backend-storage" }
demi-browser-protocol = { path = "../browser-protocol" }
demi-command-tree = { path = "../command-tree" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-provider = { path = "../provider" }
demi-web-api = { path = "../web-api" }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = { version = "2", features = ["serde"] }

[dev-dependencies]
demi-agent = { path = "../agent", features = ["testing"] }
demi-agent-protocol = { path = "../agent-protocol" }
demi-agent-store = { path = "../agent-store", features = ["testing"] }
demi-agent-tools = { path = "../agent-tools", features = ["testing"] }
demi-backend = { path = ".", features = ["testing"] }
demi-backend-runners = { path = "../backend-runners", features = ["testing"] }
demi-backend-shard = { path = "../backend-shard", features = ["testing"] }
demi-claude-protocol = { path = "../claude-protocol" }
demi-command-protocol = { path = "../command-protocol", features = ["testing"] }
demi-file-protocol = { path = "../file-protocol" }
demi-host-remote = { path = "../host-remote", features = ["testing"] }
demi-machines-protocol = { path = "../machines-protocol" }
demi-provider = { path = "../provider", features = ["testing"] }
demi-provider-claude-code = { path = "../provider-claude-code" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-shell = { path = "../shell", features = ["testing"] }
bytes.workspace = true
# The upload and retention scenarios look for images' base64 in what a
# provider was sent.
data-encoding = "2"
futures-util.workspace = true
jiff.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
# The account scenarios store password hashes of their own; `password-hash`'s
# `getrandom` gives `SaltString::generate` its operating-system RNG.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# The scenarios change and read rows behind the backend's back.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# The expose scenarios read HTTP heads byte for byte, header case included.
httparse = "1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
