[package]
name = "demi-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The video makers' tests are the crate's test binary; no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-backend"
path = "src/main.rs"
test = false

[dependencies]
demi-core-hosts = { path = "../core-hosts" }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-shared-cli = { path = "../shared-cli" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-http = { path = "../backend-http" }
demi-core-api = { path = "../core-api" }
demi-core-host-access = { path = "../core-host-access" }
demi-core-blobs = { path = "../core-blobs" }
demi-core-providers = { path = "../core-providers" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-user-shard = { path = "../backend-user-shard" }
demi-core = { path = "../core" }
demi-backend-database = { path = "../backend-database" }
demi-core-store = { path = "../core-store" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-command-package-browser-protocol = { path = "../plugin-browser/protocol" }
demi-command-declarations = { path = "../command-declarations" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-provider-common = { path = "../provider-common" }
demi-provider-registry = { path = "../provider-registry" }
demi-provider-claude-code = { path = "../provider-claude-code" }
demi-provider-codex = { path = "../provider-codex" }
demi-provider-google = { path = "../provider-google" }
demi-provider-bytedance = { path = "../provider-bytedance" }
demi-provider-minimax = { path = "../provider-minimax" }
demi-provider-openai-api = { path = "../provider-openai-api" }
demi-provider-relay = { path = "../provider-relay" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# The management socket's name and default (`crates/server/src/main.rs`), and
# the record of a server update's steps.
demi-runner-protocol = { path = "../runner-protocol" }
clap = { version = "4", features = ["derive", "env"] }
sd-notify = "0.5"
serde_json.workspace = true
# The resident memory of the backend's own process, which its resource sample logs.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = { version = "2", features = ["serde"] }

[[test]]
name = "backend"
path = "tests/backend/main.rs"

[dev-dependencies]
bytes.workspace = true
reqwest.workspace = true
# The scripted machine manager (`examples/scripted_machines`), which `xtask dev`
# runs the backend against.
# `testing` for `built_program`, which finds the runner the workspace built.
demi-command-protocol = { path = "../command-protocol", features = ["testing"] }
demi-host-interface = { path = "../host-interface" }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
futures-util.workspace = true
rustix = { version = "1", features = ["process"] }
tempfile = "3"
tokio = { workspace = true }
tokio-util.workspace = true
