[package]
name = "demi-shared-gates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true


[lib]
# One test binary, the integration tests' (`ARCHITECTURE.md`); no doc examples.
test = false
doctest = false
bench = false

