[package]
name = "demi-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The test support of the runner libraries, which the one test selection
# turns on: the native fixture program, the registry's decisions, a job's
# activity and a dispatcher on channels.
test-fixtures = [
  "demi-runner-jobs/testing",
  "demi-runner-services/testing",
  "demi-runner-shell/testing",
]

[dependencies]
demi-command-service = { path = "../command-service" }
demi-runner-host = { path = "../runner-host" }
demi-runner-jobs = { path = "../runner-jobs" }
demi-runner-process = { path = "../runner-process" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-runner-services = { path = "../runner-services" }
demi-runner-shell = { path = "../runner-shell" }
clap = { version = "4", features = ["derive", "env"] }
futures-util.workspace = true
hostname = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# sha2's ARM hardware backend is opt-in; artifact verification must not use
# its unoptimized software fallback on supported Unix ARM hosts.
[target.'cfg(all(unix, target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
bytes.workspace = true
demi-command-service = { path = "../command-service", features = ["testing"] }
# The built runner with a home and state of its own (`RunnerProcess`).
demi-host-remote = { path = "../host-remote", features = ["testing"] }
demi-shell = { path = "../shell" }
rmp-serde = "1.3"
tempfile = "3"

[[bin]]
name = "demi-runner"
path = "src/main.rs"
test = false
