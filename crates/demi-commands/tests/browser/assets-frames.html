<!doctype html>
<meta charset="utf-8">
<title>Frame assets</title>
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><circle cx="15" cy="15" r="12" fill="blue"/></svg>
<script>
if (location.pathname === '/') {
  const frame = document.createElement('iframe');
  frame.src = location.href.replace('127.0.0.1', 'localhost') + 'child';
  document.body.append(frame);
  const navigate = document.createElement('button');
  navigate.id = 'navigate';
  navigate.textContent = 'Navigate child';
  navigate.onclick = () => {
    frame.onload = () => { navigate.dataset.complete = 'true'; };
    frame.src += '?next';
  };
  document.body.append(navigate);
} else {
  const nested = document.createElement('iframe');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="red"/></svg>';
  nested.srcdoc = svg + '<img src="data:image/svg+xml,' + encodeURIComponent(svg) + '">';
  document.body.append(nested);
}
</script>
