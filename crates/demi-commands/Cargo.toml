[package]
name = "demi-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "demi-commands"
path = "src/main.rs"

[dependencies]
chromiumoxide = "=0.9.1"
futures-util.workspace = true
thiserror.workspace = true
demi-command-service = { path = "../command-service" }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile = "3"
regex = "1"
globset = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
getrandom = "0.4"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }
png = "0.18"
# Validate page tool schemas and the pinned CDP protocol without fetching external refs (MIT).
jsonschema = { version = "0.56", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
axum = "0.8"
demi-runner = { path = "../runner" }
uuid = { version = "1", features = ["v4"] }



[package.metadata.demi]
id = "demi.builtin"
operations = ["file.read", "file.create", "file.edit", "file.patch"]
