[package]
name = "demi-browser-page"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the keyboard's and the observation's internals, so they are
# unit tests and the crate has no integration tests (`crates-and-packages.md`
# § Module layout); no doc examples.
doctest = false
bench = false

[features]
# Driving a page by CSS selector, for the Chrome tests.
testing = []

[dependencies]
base64 = "0.22"
chromiumoxide = "=0.9.1"
demi-browser-driver = { path = "../browser-driver" }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-browser-tabs = { path = "../browser-tabs" }
demi-command-sdk = { path = "../command-sdk" }
futures-util.workspace = true
png = "0.18"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url = "2"
