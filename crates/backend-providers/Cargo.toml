[package]
name = "demi-backend-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the catalog cache's, the vault's and the meter's
# internals, so they are unit tests and the crate has no integration tests
# (`crates-and-packages.md` § Module layout); no doc examples.
doctest = false
bench = false

[dependencies]
demi-backend-database = { path = "../backend-database" }
demi-backend-page-sync = { path = "../backend-page-sync" }
demi-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
demi-provider-anthropic-api = { path = "../provider-anthropic-api" }
demi-provider-claude-code = { path = "../provider-claude-code" }
demi-provider-openai-api = { path = "../provider-openai-api" }
demi-web-api-protocol = { path = "../web-api-protocol" }
aes-gcm = "0.10"
futures-util.workspace = true
garde.workspace = true
hex = "0.4"
icu_collator = "2"
jiff.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["rustls", "stream"] }
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
serde_with.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-backend-database = { path = "../backend-database", features = ["testing"] }
demi-provider-common = { path = "../provider-common", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
