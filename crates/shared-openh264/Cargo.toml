[package]
name = "demi-shared-openh264"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
bench = false

[dependencies]
# Cisco's binary is checked against its pinned SHA-256 (`aws-lc-rs`), unpacked
# from bzip2 and loaded at run time (`libloading`).
aws-lc-rs = "1"
bzip2 = "0.6"
demi-shared-artifacts = { path = "../shared-artifacts" }
futures-util.workspace = true
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
