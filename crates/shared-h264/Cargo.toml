[package]
name = "demi-shared-h264"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
bench = false

[dependencies]
demi-shared-openh264 = { path = "../shared-openh264" }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
openh264-sys2 = { version = "0.9", default-features = false }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
yuv = "0.8"
