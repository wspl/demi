[package]
name = "demi-command-package-browser-preview"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout), which drive the engine over its stream; no doc examples.
test = false
doctest = false
bench = false

[features]
# Fixture sites under names of their own, and their certificates' authority
# (`testing.md` § Resources and placement).
testing = []

[dependencies]
base64.workspace = true
bytes.workspace = true
# The rules a browser adds to cookies, over cookie_store's matching
# (MIT/Apache-2.0).
cookie = "0.18"
cookie_store = { version = "0.22", default-features = false, features = ["serde"] }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-preview-rewrite = { path = "../preview-rewrite", features = ["public-suffix"] }
# Text bodies in the charset their content type names (MIT/Apache-2.0).
encoding_rs = "0.8"
futures-util.workspace = true
http.workspace = true
mime = "0.3"
# Composing the rewriter's map with a site's own for debuggers (MIT).
oxc_sourcemap = "9"
percent-encoding = "2"
psl = "2"
serde_json.workspace = true
sha2 = "0.10"
# The jar's file, replaced whole (MIT/Apache-2.0).
tempfile = "3"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"
# The Mozilla root store the upstream requests verify against
# (CDLA-Permissive-2.0).
webpki-root-certs = "1"
# Upstream requests with a browser's TLS and HTTP/2 fingerprint, on the
# vendored BoringSSL (`builds-and-releases.md` § Vendored crates); vendored
# in `vendor/wreq/wreq` and `vendor/btls/btls-sys` with Chrome 154's
# ClientHello options (Apache-2.0; btls-sys MIT, BoringSSL Apache-2.0).
wreq = { version = "=6.0.0-rc.31", features = ["gzip", "brotli", "zstd", "deflate", "stream", "ws"] }
# The browsers wreq emulates, chosen by name from the User-Agent (Apache-2.0).
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-serde"] }
# The error type wreq does not re-export: whether a connection closed before
# its response (Apache-2.0).
wreq-proto = "0.2.6"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
demi-command-package-browser-preview = { path = ".", features = ["testing"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
serde_json.workspace = true
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
