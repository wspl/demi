[package]
name = "demi-command-declarations"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
# Feature `string` names arguments at run time, from the declaration.
clap = { version = "4", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "string"] }
jsonschema = { version = "0.56", default-features = false }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
serde_with.workspace = true
thiserror.workspace = true
