[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
demi-command-package-mobile-protocol = { path = "../command-package-mobile-protocol" }
demi-live-view-protocol = { path = "../live-view-protocol" }
demi-command-package-file-protocol = { path = "../command-package-file-protocol" }
demi-command-package-fetch-protocol = { path = "../command-package-fetch-protocol" }
demi-command-package-claude-code-protocol = { path = "../command-package-claude-code-protocol" }
# `testing` for `built_program`: `xtask dev` starts the programs the
# workspace built beside it.
demi-command-protocol = { path = "../command-protocol", features = ["testing"] }
demi-shared-types = { path = "../shared-types" }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
# Copies the built web app into a server release.
fs_extra = "1.3"
futures-util.workspace = true
garde.workspace = true
# Names a development build by its time (`xtask deploy`).
jiff.workspace = true
# Plain HTTP to the backend `xtask dev` starts; the one Cargo selection
# builds it with the features the backend gives it.
reqwest.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = "2"
# Checks an npm package's license against the accepted ones and gives the
# standard text of one without a license file (`xtask notices`); the
# version cargo-about checks the crates' licenses with.
spdx = { version = "0.13", features = ["text"] }
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tempfile = "3"
tokio.workspace = true
tokio-util.workspace = true
zstd = { version = "0.13", default-features = false }

[features]
default = ["developer"]
# `xtask contracts`, `xtask dev` and `xtask logos`, which only a developer runs.
# The release workflow builds xtask without them, and so without the backend they
# compile (`.github/workflows/release.yml`).
developer = [
  "dep:demi-backend",
  "dep:demi-backend-providers",
  "dep:demi-provider-common",
  "dep:log",
  "dep:resvg",
  "dep:demi-conversation-socket-protocol",
  "dep:demi-plugin-interface",
  "dep:demi-web-api-protocol",
  "dep:axum",
  "dep:process-wrap",
]

# What `xtask contracts` and `xtask dev` need, which exist only on Unix: the
# backend builds only where it runs. The plugins the backend registers, whose
# manifests the page packages' types and the plugin page registry are
# generated from; the echo endpoint `xtask dev` serves; the process groups it
# starts its programs in.
[target.'cfg(unix)'.dependencies]
demi-backend = { path = "../backend", optional = true }
# The vendors the backend offers, read from models.dev as it reads them
# (`xtask logos`).
demi-backend-providers = { path = "../backend-providers", optional = true }
demi-provider-common = { path = "../provider-common", optional = true }
# Reads and draws a vendor's mark to tell whether a mask can paint it
# (`xtask logos`).
resvg = { version = "0.48", default-features = false, optional = true }
# usvg's warning that it could not read a mark's color (`xtask logos`).
log = { version = "0.4", optional = true }
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol", optional = true }
demi-plugin-interface = { path = "../plugin-interface", optional = true }
demi-web-api-protocol = { path = "../web-api-protocol", optional = true }
axum = { version = "0.8", optional = true }
process-wrap = { workspace = true, optional = true }

# Follows the program that started xtask, to end with it.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["event", "process"] }

[dev-dependencies]
demi-shared-artifacts = { path = "../shared-artifacts", features = ["testing"] }
