[package]
name = "demi-runner-command-packages"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# The native fixture program, the registry's decisions as a test sees them,
# and a number source that refuses (`demi_runner_services::testing`).
testing = ["dep:bytes", "demi-command-protocol/testing"]

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-sdk = { path = "../command-sdk" }
demi-runner-process = { path = "../runner-process" }
demi-runner-protocol = { path = "../runner-protocol" }
# The native fixture program's.
bytes = { workspace = true, optional = true }
futures-util.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
demi-runner-command-packages = { path = ".", features = ["testing"] }
demi-shared-artifacts = { path = "../shared-artifacts", features = ["testing"] }
sha2 = "0.10"
tempfile = "3"
tracing-subscriber.workspace = true

[[bin]]
name = "demi-native-fixture"
path = "tests/fixtures/service.rs"
required-features = ["testing"]
test = false
