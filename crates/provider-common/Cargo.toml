[package]
name = "demi-provider-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
test = false
bench = false

[features]
# A scripted runtime and clocks, for the compaction tests
# (`provider_common::testing`).
testing = []

[dependencies]
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-shared-artifacts = { path = "../shared-artifacts" }
async-stream = "0.3"
base64.workspace = true
bytes.workspace = true
eventsource-stream = "0.2"
futures-util.workspace = true
http.workspace = true
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
jiff = { workspace = true, features = ["serde"] }
regex = "1"
reqwest = { workspace = true, features = ["form", "rustls", "stream"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }
