[package]
name = "demi-provider-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
doctest = false
test = false
bench = false

[dependencies]
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
# The build version the user agent names.
demi-shared-artifacts = { path = "../shared-artifacts" }
async-stream = "0.3"
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["form", "rustls", "stream"] }
# The newest Codex CLI release the catalog request names.
semver = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_with.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
