[package]
name = "demi-backend-runners"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the pending claims' window, the codes' alphabet and the
# publication's object layout, so they are unit tests and the crate has no
# integration tests (`crates-and-packages.md` § Module layout); no doc
# examples.
doctest = false
bench = false

[features]
# A bound connection's driver without its socket (`Serving::into_driver`),
# for tests that play a device's runner.
testing = []

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-backend-blobs = { path = "../backend-blobs" }
demi-backend-database = { path = "../backend-database" }
demi-backend-page-sync = { path = "../backend-page-sync" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-gates = { path = "../shared-gates" }
demi-backend-remote-host = { path = "../backend-remote-host" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
data-encoding = "2"
futures-util.workspace = true
hex = "0.4"
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
percent-encoding = "2"
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }

[dev-dependencies]
demi-backend-blobs = { path = "../backend-blobs", features = ["testing"] }
demi-backend-remote-host = { path = "../backend-remote-host", features = ["testing"] }
demi-command-package-browser-protocol = { path = "../command-package-browser-protocol" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
