[package]
name = "demi-backend-runners"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# The crate has no tests and no doc examples.
test = false
doctest = false
bench = false

[features]
# A bound connection's driver without its socket (`Serving::into_driver`),
# for tests that play a device's runner.
testing = []

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-backend-blobs = { path = "../backend-blobs" }
demi-backend-database = { path = "../backend-database" }
demi-backend-page-sync = { path = "../backend-page-sync" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-gates = { path = "../shared-gates" }
demi-backend-remote-host = { path = "../backend-remote-host", features = ["edge"] }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# A runner's connection is the WebSocket the edge upgraded.
axum = { version = "0.8", features = ["ws"] }
bytes.workspace = true
data-encoding = "2"
futures-util.workspace = true
hex = "0.4"
jiff.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
percent-encoding = "2"
rand = "0.9"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = { version = "2", features = ["serde"] }
