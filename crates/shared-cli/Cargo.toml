[package]
name = "demi-shared-cli"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# The crate's one test binary is tests/cli (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# The programs that run on a Host, the runner and the command programs, turn
# it on: built for a musl target, they allocate with mimalloc
# (`builds-and-releases.md` § Memory allocator).
host-allocator = ["dep:mimalloc"]

[dependencies]
clap = { version = "4", features = ["env"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", optional = true }
