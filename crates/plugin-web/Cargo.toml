[package]
name = "demi-plugin-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
# An access token's claims, which may name the account's email.
base64.workspace = true
demi-command-declarations = { path = "../command-declarations" }
demi-command-package-fetch-protocol = { path = "../command-package-fetch-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
# An MCP answer sent as an event stream.
eventsource-stream = "0.2"
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url = "2"

[dev-dependencies]
# The plugin runs through the JSON loopback over an in-memory Demi, whose
# outbound requests a fake Exa answers.
demi-command-declarations = { path = "../command-declarations" }
demi-host-interface = { path = "../host-interface", features = ["testing"] }
demi-plugin-interface = { path = "../plugin-interface", features = ["testing"] }
demi-web-api-protocol = { path = "../web-api-protocol" }
tokio.workspace = true
