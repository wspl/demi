[package]
name = "demi-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test.
doctest = false

[[bin]]
name = "demi-browser"
path = "src/main.rs"
test = false

[features]
# Page-driving helpers, and Chrome's own targets, for the Chrome tests.
testing = []

[dependencies]
demi-artifact = { path = "../artifact" }
chromiumoxide = "=0.9.1"
futures-util.workspace = true
garde.workspace = true
thiserror.workspace = true
demi-browser-protocol = { path = "../browser-protocol" }
demi-core = { path = "../core" }
demi-command-service = { path = "../command-service" }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile = "3"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.4"
url = "2"
png = "0.18"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# Validate page tool schemas and the pinned CDP protocol without fetching external refs (MIT).
jsonschema = { version = "0.56", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
# The repair tests fetch from their fixture site.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
axum = "0.8"
demi-artifact = { path = "../artifact", features = ["testing"] }
demi-command-service = { path = "../command-service", features = ["testing"] }
uuid = { version = "1", features = ["v4"] }
