[package]
name = "demi-browser"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-browser"
path = "src/main.rs"
test = false

[features]
# The browser libraries' test support, for the Chrome tests.
testing = [
  "demi-browser-cdp/testing",
  "demi-browser-driver/testing",
  "demi-browser-page/testing",
  "demi-browser-tabs/testing",
]

[dependencies]
bytes.workspace = true
demi-browser-cdp = { path = "../browser-cdp" }
demi-browser-driver = { path = "../browser-driver" }
demi-browser-live = { path = "../browser-live" }
demi-browser-page = { path = "../browser-page" }
demi-browser-protocol = { path = "../browser-protocol" }
demi-browser-tabs = { path = "../browser-tabs" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-service = { path = "../command-service" }
futures-util.workspace = true
png = "0.18"
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
demi-artifact = { path = "../artifact", features = ["testing"] }
demi-command-service = { path = "../command-service", features = ["testing"] }
regex = "1"
# The repair tests fetch from their fixture site.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }

# The retirement tests read the process table.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
