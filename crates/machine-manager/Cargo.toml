[package]
name = "demi-machine-manager"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[[bin]]
name = "demi-machine-manager"
path = "src/main.rs"
test = false

[dependencies]
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-shared-cli = { path = "../shared-cli" }
demi-shared-types = { path = "../shared-types", features = ["tracing"] }
demi-machine-manager-protocol = { path = "../machine-manager-protocol" }
demi-runner-protocol = { path = "../runner-protocol" }
clap = { version = "4", features = ["derive", "env"] }
fs-err = "3"
futures-util.workspace = true
ipnet = "2"
nftables = "0.6"
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
serde.workspace = true
serde_json.workspace = true
tar = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
linux-raw-sys = { version = "0.12", default-features = false, features = ["ioctl", "loop_device", "std"] }
rtnetlink = "0.23"
rustix = { version = "1", features = ["fs", "mount", "process", "thread"] }
sd-notify = "0.5"
sha2 = "0.10"
tracing-subscriber.workspace = true
walkdir = "2"

# sha2's ARM hardware backend is opt-in; base import hashes the whole archive.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
