[package]
name = "demi-backend-idle-watch"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests drive the watch on a paused clock through its policy, so they are
# unit tests and the crate has no integration tests (`crates-and-packages.md`
# § Module layout); no doc examples.
doctest = false
bench = false

[dependencies]
demi-shared-gates = { path = "../shared-gates" }
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
