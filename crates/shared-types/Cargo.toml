[package]
name = "demi-shared-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true


[features]
# `whole_image`: decodes an image whole, refusing one cut short.
whole-image = ["dep:image"]
# `mp4`: reads what an MP4 file holds from its header.
mp4 = ["dep:mp4parse"]
# `audio`: reads an audio file's format and length from its header.
audio = ["dep:symphonia"]

[lib]
# No doc examples: rustdoc has nothing to test. The tests are in tests/core,
# so the library needs no test harness of its own.
doctest = false
test = false
bench = false

[dependencies]
base64.workspace = true
bytes.workspace = true
garde.workspace = true
jiff.workspace = true
regex = "1"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_plain.workspace = true
serde_with.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# Terminal widths, which command output aligns its tables by
# (`output`, `crates/shared-types/src/output.rs`).
unicode-width = "0.2"
# The one check that an image's bytes are a whole picture, for the crates
# that turn on `whole-image`.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
# The one reader of an MP4's header, for the crates that turn on `mp4`.
mp4parse = { version = "0.17", optional = true }
# The one reader of an audio file's format and length, for the crates that
# turn on `audio`: the containers and codecs a vendor answers with, probed
# and read packet by packet, never decoded.
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "wav"], optional = true }
