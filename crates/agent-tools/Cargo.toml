[package]
name = "demi-agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Its tests reach the tools' internals, so they are unit tests and the crate
# has no integration tests (`crates-and-packages.md` § Module layout); no doc
# examples.
doctest = false
bench = false

[features]
# A Host type for agents without shell tools and the readers of a shell
# tool's result (`agent_tools::testing`), with the session's test support.
testing = ["demi-agent-session/testing"]

[dependencies]
bytes.workspace = true
demi-conversation-socket-protocol = { path = "../conversation-socket-protocol" }
demi-agent-session = { path = "../agent-session" }
demi-agent-store = { path = "../agent-store" }
demi-agent-transcript = { path = "../agent-transcript" }
demi-shared-types = { path = "../shared-types" }
demi-provider-common = { path = "../provider-common" }
demi-host-interface = { path = "../host-interface" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
serde_with.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
demi-agent-store = { path = "../agent-store", features = ["testing"] }
