[package]
name = "demi-backend-host-access"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# Its tests reach the transfers' registration, the answers a download's
# metadata decides and an attachment's commit, so they are unit tests and the crate has no integration
# tests (`ARCHITECTURE.md`); the operations over a
# shard are tested in `backend-user-shard`, which implements `HostShard`. No doc
# examples.
doctest = false
bench = false

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-agent-tools = { path = "../agent-tools" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-blobs = { path = "../backend-blobs" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-database = { path = "../backend-database" }
demi-command-protocol = { path = "../command-protocol" }
demi-command-declarations = { path = "../command-declarations" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-backend-remote-host = { path = "../backend-remote-host" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-web-api-protocol = { path = "../web-api-protocol" }
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
garde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url = "2"

[dev-dependencies]
demi-backend-database = { path = "../backend-database", features = ["testing"] }
demi-backend-remote-host = { path = "../backend-remote-host", features = ["testing"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
