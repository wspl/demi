[package]
name = "demi-backend-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Its tests reach the router without a socket, the transfers' byte copies
# and the answers the edge decides by itself, so they are unit tests and the
# crate has no integration tests (`crates-and-packages.md` § Module layout);
# no doc examples.
doctest = false
bench = false

[features]
# The hold of the runners' hellos at the edge's token lookup
# (`Backend::hold_hellos`).
testing = ["demi-backend-shard/testing"]

[dependencies]
demi-agent-protocol = { path = "../agent-protocol" }
demi-agent-store = { path = "../agent-store" }
demi-artifact = { path = "../artifact" }
demi-backend-accounts = { path = "../backend-accounts" }
demi-backend-cloud = { path = "../backend-cloud" }
demi-backend-expose = { path = "../backend-expose" }
demi-backend-host-access = { path = "../backend-host-access" }
demi-backend-objects = { path = "../backend-objects" }
demi-backend-providers = { path = "../backend-providers" }
demi-backend-runners = { path = "../backend-runners" }
demi-backend-shard = { path = "../backend-shard" }
demi-backend-storage = { path = "../backend-storage" }
demi-backend-sync = { path = "../backend-sync" }
demi-browser-protocol = { path = "../browser-protocol" }
demi-command-protocol = { path = "../command-protocol" }
demi-core = { path = "../core" }
demi-host-remote = { path = "../host-remote" }
demi-provider = { path = "../provider" }
demi-runner-protocol = { path = "../runner-protocol" }
demi-shell = { path = "../shell" }
demi-web-api = { path = "../web-api" }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
bytes.workspace = true
cookie = "0.18"
futures-util.workspace = true
garde.workspace = true
http-body = "1"
# The edge serves its connections itself, keeping header case, and the
# expose relay forwards with the HTTP/1 client (`expose.md` § Rationale).
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime = "0.3"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing.workspace = true
typed-path = "0.12"
url = "2"

[dev-dependencies]
demi-backend-shard = { path = "../backend-shard", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
