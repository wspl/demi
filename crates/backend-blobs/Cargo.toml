[package]
name = "demi-backend-blobs"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-agent-store = { path = "../agent-store" }
demi-shared-types = { path = "../shared-types" }
demi-web-api-protocol = { path = "../web-api-protocol" }
# Implements `object_store`'s trait for the local store, which keeps its
# objects' attributes beside them.
async-trait = "0.1"
bytes.workspace = true
futures-util.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url = { version = "2", features = ["serde"] }
