[package]
name = "demi-agent-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# What a session's tests read of it besides its public items
# (`agent_session::testing`), with the test support of the crates below.
testing = ["demi-agent-transcript/testing", "demi-provider/testing"]

[dependencies]
demi-agent-protocol = { path = "../agent-protocol" }
demi-agent-store = { path = "../agent-store" }
demi-agent-transcript = { path = "../agent-transcript" }
demi-command-service = { path = "../command-service" }
demi-core = { path = "../core" }
demi-gates = { path = "../gates" }
demi-provider = { path = "../provider" }
demi-shell = { path = "../shell" }
futures-util.workspace = true
garde.workspace = true
rand = "0.9"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
demi-agent-session = { path = ".", features = ["testing"] }
# Each provider's format of a session's requests (`requests.rs`,
# `providers.md` § The rule).
demi-provider-anthropic-api = { path = "../provider-anthropic-api" }
demi-provider-codex = { path = "../provider-codex", features = ["testing"] }
demi-provider-google = { path = "../provider-google" }
demi-provider-grok-build = { path = "../provider-grok-build" }
demi-provider-openai-api = { path = "../provider-openai-api" }
reqwest = { version = "0.12", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
