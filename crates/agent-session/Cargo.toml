[package]
name = "demi-agent-session"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The compaction tests are the crate's one test binary; no doc examples.
test = false
doctest = false
bench = false

[features]
# What a session's tests read of it besides its public items
# (`agent_session::testing`), with the test support of the crates below.
testing = ["demi-agent-transcript/testing", "demi-provider-common/testing"]

[dependencies]
demi-conversation-lane-protocol = { path = "../conversation-lane-protocol" }
demi-agent-store = { path = "../agent-store" }
demi-agent-transcript = { path = "../agent-transcript" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types" }
demi-shared-gates = { path = "../shared-gates" }
demi-provider-common = { path = "../provider-common" }
demi-host-interface = { path = "../host-interface" }
futures-util.workspace = true
garde.workspace = true
jiter = "0.17"
rand = "0.9"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
demi-agent-session = { path = ".", features = ["testing"] }
demi-provider-claude-code = { path = "../provider-claude-code", features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
