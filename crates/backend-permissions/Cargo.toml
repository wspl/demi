[package]
name = "demi-backend-permissions"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Demi-License"
publish.workspace = true

[lib]
# The backend's permission scenarios cover the check, the decisions and
# their messages at the boundaries the agent and the page observe
# (`crates-and-packages.md` § Module layout). The unit tests hold what no
# scenario can order: a stop and an allow ready at the same moment. No doc
# examples.
doctest = false
bench = false

[dependencies]
demi-backend-database = { path = "../backend-database" }
demi-backend-page-sync = { path = "../backend-page-sync" }
demi-command-declarations = { path = "../command-declarations" }
demi-host-interface = { path = "../host-interface" }
demi-shared-types = { path = "../shared-types" }
demi-web-api-protocol = { path = "../web-api-protocol" }
futures-util.workspace = true
shlex = "2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
demi-host-interface = { path = "../host-interface", features = ["testing"] }
tokio-util.workspace = true
