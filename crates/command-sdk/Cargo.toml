[package]
name = "demi-command-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# No doc examples.
test = false
doctest = false
bench = false

[dependencies]
bytes.workspace = true
clap = { version = "4", default-features = false, features = ["derive", "error-context", "std", "usage"] }
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-protocol = { path = "../command-protocol" }
demi-shared-types = { path = "../shared-types", features = ["tracing"] }
futures-util.workspace = true
h2.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sync_wrapper = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
