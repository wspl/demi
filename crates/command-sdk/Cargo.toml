[package]
name = "demi-command-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true


[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[features]
# A started service binary, counting numbers and the count of pauses for
# tests (`command_service::testing`), with the protocol's test support.
testing = ["demi-command-protocol/testing"]

[dependencies]
bytes.workspace = true
demi-shared-artifacts = { path = "../shared-artifacts" }
demi-command-protocol = { path = "../command-protocol" }
futures-util.workspace = true
h2.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sync_wrapper = "1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
# The crate's own tests count its pauses (`testing::pauses`) and run on a
# paused clock.
demi-command-sdk = { path = ".", features = ["testing"] }
# The package tests check artifact locations with the protocol's rules.
garde.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
