[package]
name = "demi-gates"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true


[lib]
# No doc examples: rustdoc has nothing to test.
doctest = false

[features]
# A view of the entrants waiting at an activity gate, for the tests of the
# crates that use one.
testing = []

[dependencies]
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
