[package]
name = "demi-plugin-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# One test binary, the integration tests' (`crates-and-packages.md`
# § Module layout); no doc examples.
test = false
doctest = false
bench = false

[dependencies]
demi-host-interface = { path = "../host-interface" }
demi-plugin-interface = { path = "../plugin-interface" }
demi-plugin-media = { path = "../plugin-media" }
# The audio file's header, read by the one reader the ledger's seconds come
# from.
demi-shared-types = { path = "../shared-types", features = ["audio"] }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The plugin runs through the JSON loopback over an in-memory Demi, which
# answers its audio and voices.
demi-command-declarations = { path = "../command-declarations" }
demi-host-interface = { path = "../host-interface", features = ["testing"] }
demi-plugin-interface = { path = "../plugin-interface", features = ["testing"] }
demi-web-api-protocol = { path = "../web-api-protocol" }
tokio.workspace = true
