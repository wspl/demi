    "Files, streams, the environment, printing and exit go through uucore::context, so a run embedded in a shell job uses the job's working directory, environment, standard streams and cancellation, and exit ends only the utility",
    "uucore's process feature is a dependency on Unix only, where install compares a destination's owner with the effective user: its Windows code signals a child process, which the context's Child is not",
    "Windows builds it: there it has no Unix mode or owner, so a mode is not applied and an owner or group is a number that changes nothing",
    "On macOS the options of its own install are read: -B names the backup suffix, -b backs up to file.old, and -f takes file flags and ignores them",
